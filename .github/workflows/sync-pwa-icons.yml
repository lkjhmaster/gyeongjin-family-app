name: Sync exact PWA PNG icons

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert the source JPG icons to PNG
        run: |
          magick icon-192.jpg -strip icon-192.png
          magick icon-512.jpg -strip icon-512.png

      - name: Commit PNG icons when changed
        run: |
          if git diff --quiet -- icon-192.png icon-512.png; then
            echo "PNG icons are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git commit -m "PWA 아이콘 PNG 동기화"
          git push
