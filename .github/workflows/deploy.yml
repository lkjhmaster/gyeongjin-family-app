name: Deploy family app
on:
  workflow_run:
    workflows: ["Validate app"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: family-app-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate checked-out revision
        run: |
          node scripts/check-inline-js.mjs
          node --check src/worker.js
          node --test tests/child-transactions/*.test.cjs
          node --test scripts/test-child-trade-list.cjs
          node --test scripts/test-child-trade-lifecycle.mjs
          node --test scripts/test-child-trade-ui.cjs
          python3 scripts/test-child-trade-schema.py
          node scripts/check-production-allowance.mjs
          node --test scripts/test-repayment.mjs
          node scripts/check-split-payment.mjs
          node scripts/test-split-payment.mjs
      - name: Require Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Verify D1 recovery point before additive migration
        run: npx --yes wrangler@4 d1 time-travel info gyeongjin-family-db --config wrangler.api.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply approved additive child-trade schema
        run: |
          npx --yes wrangler@4 d1 execute gyeongjin-family-db --config wrangler.api.jsonc --remote --file=migrations/child-trades/0001_additive_schema.sql
          npx --yes wrangler@4 d1 execute gyeongjin-family-db --config wrangler.api.jsonc --remote --file=migrations/child-trades/0002_atomic_lifecycle.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify child-trade tables and concurrency guard in production D1
        run: |
          npx --yes wrangler@4 d1 execute gyeongjin-family-db --config wrangler.api.jsonc --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name='child_trade_transactions';" | tee /tmp/child-trade-table.txt
          grep -q 'child_trade_transactions' /tmp/child-trade-table.txt
          npx --yes wrangler@4 d1 execute gyeongjin-family-db --config wrangler.api.jsonc --remote --command="SELECT name FROM sqlite_master WHERE type='index' AND name='child_trade_one_pending_loan_per_borrower';" | tee /tmp/child-trade-index.txt
          grep -q 'child_trade_one_pending_loan_per_borrower' /tmp/child-trade-index.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy API with existing D1 binding
        run: npx --yes wrangler@4 deploy --config wrangler.api.jsonc --var RELEASE_SHA:$(git rev-parse HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify API revision and D1 before publishing UI
        run: node scripts/check-deployed-api.mjs
        env:
          EXPECTED_RELEASE: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy static PWA to Cloudflare Workers
        run: npx --yes wrangler@4 deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed HTML and service worker after propagation
        run: node scripts/check-deployed-app.mjs
