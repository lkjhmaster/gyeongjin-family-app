name: Validate app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  checks: write
  statuses: write
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Test child transaction domain rules
        run: |
          node --test tests/child-transactions/*.test.cjs
      - name: Test child trade API access control
        run: node --test scripts/test-child-trade-list.cjs
      - name: Test child trade loan request safety
        run: node --test --test-reporter=tap scripts/test-child-trade-lifecycle.mjs
      - name: Verify child trade UI safeguards
        run: |
          node --test scripts/test-child-trade-ui.cjs
          node --test scripts/test-daily-chore-reward.cjs
          node --check src/child-transactions/lifecycle.js
      - name: Verify D1 schema and pending loan uniqueness
        run: python3 scripts/test-child-trade-schema.py
      - name: Check Worker syntax
        run: node --check src/worker.js
      - name: Check production allowance UI
        run: node scripts/check-production-allowance.mjs
      - name: Verify split payment safety and integration
        run: |
          node scripts/check-split-payment.mjs
          node scripts/test-split-payment.mjs
      - name: Verify repayment cancellation and UI integration
        run: |
          node --test scripts/test-repayment.mjs
          node --test scripts/test-aggregate-repayment.mjs

      - name: Build Cloudflare API bundle
        run: npx --yes wrangler@4 deploy --config wrangler.api.jsonc --dry-run
      - name: Verify actual desktop browser flows
        run: |
          npm install --prefix "$RUNNER_TEMP/family-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/family-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/family-browser/node_modules/playwright" node scripts/test-child-trade-browser.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/family-browser/node_modules/playwright" node scripts/test-choice-dialog.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/family-browser/node_modules/playwright" node scripts/test-aggregate-repayment-browser.cjs

      - name: Publish validation commit status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          RESULT: ${{ job.status }}
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const state = process.env.RESULT === 'success' ? 'success' : 'failure';
            const sha = process.env.TARGET_SHA;
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, state,
              context: 'family-app/validate',
              description: state === 'success' ? 'All validation steps passed' : 'Validation failed or was cancelled; see Actions run',
              target_url
            });
            await core.summary.addHeading('Validation status').addRaw(`Result: ${state}\nCommit: ${sha}\nRun: ${target_url}`).write();
