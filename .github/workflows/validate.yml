name: Validate app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Test child transaction domain rules
        run: |
          node --test tests/child-transactions/*.test.cjs
      - name: Test child trade API access control
        run: node --test scripts/test-child-trade-list.cjs
      - name: Test child trade loan request safety
        run: node --test scripts/test-child-trade-request.cjs
      - name: Verify child trade UI safeguards
        run: node --test scripts/test-child-trade-ui.cjs
      - name: Verify D1 schema and pending loan uniqueness
        run: python3 scripts/test-child-trade-schema.py
      - name: Check Worker syntax
        run: node --check src/worker.js
      - name: Check production allowance UI
        run: node scripts/check-production-allowance.mjs
      - name: Verify split payment safety and integration
        run: |
          node scripts/check-split-payment.mjs
          node scripts/test-split-payment.mjs
      - name: Verify repayment cancellation and UI integration
        run: node --test scripts/test-repayment.mjs
