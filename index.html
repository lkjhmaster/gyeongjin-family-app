<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf4"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192-v2.png" type="image/png"><link rel="apple-touch-icon" href="/icon-192-v2.png">
<title>경진훈주시라</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#26231f;--muted:#82796f;--line:#eee5da;--accent:#e88963;--accent2:#6f9c8b;--soft:#f7eee5;--danger:#c76d6d}*{box-sizing:border-box}body{margin:0;background:#f1ece6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:82px}.top{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}.page{padding:8px 20px 20px}.eyebrow{color:var(--accent);font-weight:800;font-size:13px;margin:8px 0}.title{font-size:28px;line-height:1.25;margin:0 0 8px}.sub{color:var(--muted);line-height:1.55;margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 3px 12px rgba(80,50,20,.04)}.hero{background:linear-gradient(135deg,#fff0e6,#fffaf4)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);padding:14px;border-radius:16px}.stat b{display:block;font-size:22px;margin-bottom:3px}.label{font-size:12px;color:var(--muted)}button,.btn{border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--ink)}.ghost{background:transparent;color:var(--muted)}.full{width:100%}.section-title{font-size:17px;font-weight:900;margin:22px 0 10px}.event{padding:15px;border:1px solid var(--line);border-radius:17px;margin:9px 0;background:#fff}.event small{color:var(--muted)}.tag{display:inline-block;background:#f2eee9;border-radius:999px;padding:6px 9px;margin:4px 3px 0 0;font-size:12px}.member{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f0d6c5;font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:rgba(255,250,244,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.nav button{background:none;color:var(--muted);border-radius:0}.nav button.active{color:var(--accent)}.nav span{display:block;font-size:11px;margin-top:3px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;font:inherit;color:var(--ink);outline:none}textarea{min-height:90px;resize:vertical}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;font-weight:700}.choice button.sel{border-color:var(--accent);background:#fff0e6;color:#a9532e}.back{margin-bottom:8px}.progress{height:7px;background:#eee5da;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:75%}.vote{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.check{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;background:#fff}.check.on{background:var(--accent);color:#fff}.memory{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0}.memory .fakephoto{height:170px;background:linear-gradient(135deg,#e7d2bd,#c5d5cb);display:grid;place-items:center;font-size:44px}.memory .body{padding:15px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#2c2925;color:#fff;padding:11px 15px;border-radius:12px;display:none;font-size:13px;z-index:20}.hide{display:none!important}
</style></head>
<body><div class="app"><header class="top"><div class="brand">경진훈주시라</div><div style="display:flex;gap:6px"><button id="installBtn" class="pill hide" onclick="installApp()">앱 설치</button><button id="familyCount" class="pill" onclick="show('profile')">가족 5명</button></div></header><main id="main"></main><nav class="nav"><button id="nav-home" onclick="home()">⌂<span>홈</span></button><button id="nav-create" onclick="create()">＋<span>가족시간</span></button><button id="nav-memory" onclick="memories()">♡<span>추억</span></button></nav></div><div id="toast" class="toast"></div>
<script>
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;document.querySelector("#installBtn")?.classList.remove("hide");});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;document.querySelector("#installBtn")?.classList.add("hide");toast("경진훈주시라 설치가 완료됐어요");});
async function installApp(){if(!deferredInstallPrompt){toast("아직 설치 조건을 확인하는 중이에요");return;}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.querySelector("#installBtn")?.classList.add("hide");}

const savedMemories=readJSON('gyeongjin_memories',null);
const savedEvent=readJSON('gyeongjin_event',null);
const state={page:'home',selected:[],vote:{a:3,b:2,c:1},event:savedEvent,memories:Array.isArray(savedMemories)?savedMemories:[]};
const $=s=>document.querySelector(s);function readJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch(e){return fallback}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1600)}
function nav(k){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#nav-'+k)?.classList.add('active')}
function shell(html){$('#main').innerHTML=html}
function updateFamilyCount(){const el=$('#familyCount');if(el)el.textContent='가족 '+family.members.length+'명'}
function normalizeState(){if(!Array.isArray(state.memories))state.memories=[];state.memories=state.memories.map(m=>({...m,photoData:typeof m.photoData==='string'?m.photoData:'',photoName:typeof m.photoName==='string'?m.photoName:''}));if(state.event&&typeof state.event==='object'){state.event.candidates=Array.isArray(state.event.candidates)?state.event.candidates:[];state.event.votes=state.event.votes&&typeof state.event.votes==='object'?state.event.votes:{};state.event.finalized=state.event.finalized===true;state.event.finalCandidate=typeof state.event.finalCandidate==='string'?state.event.finalCandidate:'';localStorage.setItem('gyeongjin_event',JSON.stringify(state.event));}localStorage.setItem('gyeongjin_memories',JSON.stringify(state.memories))}
function timeOptions(selected){return Array.from({length:15},(_,i)=>String(i+8).padStart(2,'0')+':00').map(t=>'<option '+(t===selected?'selected':'')+'>'+t+'</option>').join('')}
function schedule(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),ym=y+'-'+String(m+1).padStart(2,'0');const all=readJSON('gyeongjin_schedules',{});state.schedules=all[ym]||{};const days=new Date(y,m+1,0).getDate();const cells=Array.from({length:days},(_,i)=>{const d=String(i+1).padStart(2,'0'),rows=family.members.map(mem=>{const x=state.schedules[d]?.[mem.name]||{},status=typeof x==='string'?x:(x.status||'미정'),memo=typeof x==='string'?x:(x.memo||''),start=x.start||'10:00',end=x.end||'18:00',key=encodeURIComponent(mem.name),sid='start_'+d+'_'+key,eid='end_'+d+'_'+key;return '<div class="schedule-row"><div class="row"><b>'+esc(mem.name)+'</b><select onchange="scheduleStatus(\''+d+'\',\''+key+'\',this.value)"><option '+(status==='미정'?'selected':'')+'>미정</option><option '+(status==='가능'?'selected':'')+'>가능</option><option '+(status==='불가'?'selected':'')+'>불가</option></select></div><div style="display:'+((status==='가능')?'grid':'none')+';grid-template-columns:1fr 1fr;gap:7px;margin-top:7px"><select id="'+sid+'" onchange="saveScheduleTime(\''+d+'\',\''+key+'\',this.value,document.getElementById(\''+eid+'\').value)">'+timeOptions(start)+'</select><select id="'+eid+'" onchange="saveScheduleTime(\''+d+'\',\''+key+'\',document.getElementById(\''+sid+'\').value,this.value)">'+timeOptions(end)+'</select></div><input value="'+esc(memo)+'" placeholder="일정 메모" onchange="saveScheduleMemo(\''+d+'\',\''+key+'\',this.value)"></div>'}).join('');return '<div class="card"><div class="small">'+y+'.'+String(m+1).padStart(2,'0')+'.'+d+'</div>'+rows+'</div>'}).join('');shell('<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">FAMILY CALENDAR</div><h1 class="title">가족 일정</h1><p class="sub">각자의 가능 여부와 가능한 시간을 입력하면 가족 모두의 공통 가능 시간을 자동으로 계산합니다.</p><div class="card"><b>공통 가능 시간 기준</b><p class="label">08:00~22:00 · 1시간 단위 · 모두가 "가능"으로 입력한 시간만 계산</p></div>'+cells+'</div>')}
function saveScheduleData(day,key,patch){const name=decodeURIComponent(key),now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');const all=readJSON('gyeongjin_schedules',{});all[ym]=all[ym]||{};all[ym][day]=all[ym][day]||{};const prev=typeof all[ym][day][name]==='object'?all[ym][day][name]:{};all[ym][day][name]={status:patch.status??prev.status??'미정',memo:patch.memo??prev.memo??'',start:patch.start??prev.start??'10:00',end:patch.end??prev.end??'18:00'};localStorage.setItem('gyeongjin_schedules',JSON.stringify(all))}
function scheduleStatus(day,key,status){saveScheduleData(day,key,{status});toast('일정 상태가 저장됐어요');schedule()}
function saveScheduleTime(day,key,start,end){if(Number(start.slice(0,2))>=Number(end.slice(0,2))){toast('종료 시간은 시작 시간보다 늦어야 해요');return}saveScheduleData(day,key,{status:'가능',start,end});toast('가능 시간이 저장됐어요')}
function saveScheduleMemo(day,key,memo){saveScheduleData(day,key,{memo:(memo||'').trim()});toast('메모가 저장됐어요')}
function getCommonAvailability(){const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),all=readJSON('gyeongjin_schedules',{}),month=all[ym]||{};return Object.keys(month).filter(day=>family.members.length&&family.members.every(mem=>month[day]?.[mem.name]?.status==='가능')).sort((a,b)=>Number(a)-Number(b))}
function getCommonTimeRanges(day){const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),all=readJSON('gyeongjin_schedules',{}),rows=family.members.map(mem=>all[ym]?.[day]?.[mem.name]).filter(x=>x&&x.status==='가능'&&x.start&&x.end);if(rows.length!==family.members.length)return [];const start=Math.max(...rows.map(x=>Number(x.start.slice(0,2))));const end=Math.min(...rows.map(x=>Number(x.end.slice(0,2))));if(end<=start)return [];return [{start:String(start).padStart(2,'0')+':00',end:String(end).padStart(2,'0')+':00'}]}
function getCommonSlots(){return getCommonAvailability().flatMap(day=>getCommonTimeRanges(day).map(range=>({day,...range})))} 
function seedFamilyAppTestData(){if(!confirm('초기모델 테스트 데이터를 넣을까요? 현재 일정·가족시간·추억 데이터는 테스트 데이터로 교체됩니다.'))return;const now=new Date(),y=now.getFullYear(),m=now.getMonth(),ym=y+'-'+String(m+1).padStart(2,'0'),days=[Math.min(3,new Date(y,m+1,0).getDate()),Math.min(10,new Date(y,m+1,0).getDate()),Math.min(17,new Date(y,m+1,0).getDate())];const all={};all[ym]={};days.forEach((day,i)=>{const d=String(day).padStart(2,'0');all[ym][d]={};family.members.forEach((mem,idx)=>{const starts=['10:00','11:00','12:00','13:00','14:00'];const ends=['18:00','19:00','20:00','21:00','18:00'];all[ym][d][mem.name]={status:'가능',memo:i===0&&idx===0?'초기모델 테스트 일정':'',start:starts[idx%starts.length],end:ends[idx%ends.length]}})});localStorage.setItem('gyeongjin_schedules',JSON.stringify(all));['gyeongjin_event','gyeongjin_memories','gyeongjin_current_member'].forEach(k=>localStorage.removeItem(k));state.event=null;state.memories=[];state.selected=[];state.draft=null;toast('초기모델 테스트 데이터가 준비됐어요');setTimeout(home,700)}
function resetFamilyAppData(){if(!confirm('가족 앱의 테스트 데이터를 초기화할까요?'))return;['gyeongjin_schedules','gyeongjin_event','gyeongjin_memories','gyeongjin_current_member'].forEach(k=>localStorage.removeItem(k));state.event=null;state.memories=[];state.selected=[];state.draft=null;toast('테스트 데이터가 초기화됐어요');setTimeout(home,500)}
function home(){state.page='home';updateFamilyCount();nav('home');const ev=state.event;const activeCount=ev&&!ev.finalized?1:0;const memoryCount=state.memories.length;const latest=state.memories[0];const eventHtml=ev?`<div class="event" onclick="${ev.finalized?'detail()':'vote()'}"><div class="row"><b>${esc(ev.title)}</b><span class="tag">${ev.finalized?'확정':'투표 중'}</span></div><small>${esc(ev.date)} · ${esc(ev.time)} · 후보 ${ev.candidates?.length||0}개</small></div>`:`<div class="event" onclick="create()"><div class="row"><b>아직 정한 가족시간이 없어요</b><span class="tag">시작하기</span></div><small>우리 가족이 함께할 시간을 만들어보세요.</small></div>`;shell(`<div class="page"><section class="card hero"><div class="eyebrow">우리 가족의 다음 시간</div><h1 class="title">이번 주, 같이<br>무엇을 해볼까요?</h1><p class="sub">모두 가능한 시간을 먼저 맞추고,<br>가족이 함께 정한 시간을 추억으로 남겨요.</p><button class="primary full" onclick="create()">가족시간 만들기</button><button class="ghost full" onclick="schedule()">📅 가족 일정 보기</button></section><div class="grid"><div class="stat"><b>${activeCount}</b><span class="label">진행 중인 가족시간</span></div><div class="stat"><b>${memoryCount}</b><span class="label">우리 가족의 추억</span></div></div><h2 class="section-title">가족시간</h2>${eventHtml}<h2 class="section-title">최근 추억</h2>${latest?`<div class="memory" onclick="memories()"><div class="fakephoto">${latest.photoData?`<img src="${latest.photoData}" alt="최근 가족 추억" style="width:100%;height:100%;object-fit:cover">`:"📷"}</div><div class="body"><b>${esc(latest.title)}</b><br><small>${esc(latest.date)} · ${esc(latest.mood)}</small></div></div>`:`<div class="event" onclick="memories()"><div class="row"><b>아직 저장된 추억이 없어요</b><span class="tag">추억 남기기</span></div><small>가족시간을 보낸 뒤 사진과 한마디를 남겨보세요.</small></div>`}</div>`)}
function create(){nav('create');state.draft=state.draft||{period:'이번 주',day:'토',time:'오후 1시 ~ 6시'};shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">STEP 1 / 3</div><h1 class="title">가족시간 만들기</h1><p class="sub">먼저 모두가 가능한 시간을 찾아볼게요.</p><div class="card"><div class="field"><label>언제쯤?</label><div class="choice" id="dates"><button class="${state.draft.period==='이번 주'?'sel':''}" onclick="pickValue('period','이번 주',this)">이번 주</button><button class="${state.draft.period==='다음 주'?'sel':''}" onclick="pickValue('period','다음 주',this)">다음 주</button><button class="${state.draft.period==='10월 첫째 주'?'sel':''}" onclick="pickValue('period','10월 첫째 주',this)">10월 첫째 주</button></div></div><div class="field"><label>가능한 요일</label><div class="choice"><button class="${state.draft.day==='토'?'sel':''}" onclick="pickValue('day','토',this)">토</button><button class="${state.draft.day==='일'?'sel':''}" onclick="pickValue('day','일',this)">일</button><button class="${state.draft.day==='평일'?'sel':''}" onclick="pickValue('day','평일',this)">평일</button></div></div><div class="field"><label>시간대</label><select onchange="state.draft.time=this.value"><option ${state.draft.time==='오후 1시 ~ 6시'?'selected':''}>오후 1시 ~ 6시</option><option ${state.draft.time==='오전 10시 ~ 오후 3시'?'selected':''}>오전 10시 ~ 오후 3시</option><option ${state.draft.time==='오후 5시 ~ 9시'?'selected':''}>오후 5시 ~ 9시</option></select></div></div><div class="card"><div class="row"><div><b>참여 가족</b><div class="label">부모 ${family.members.filter(m=>m.role==='부모').length}명 + 자녀 ${family.members.filter(m=>m.role!=='부모').length}명</div></div><div class="member">${family.members.slice(0,3).map(m=>`<div class="avatar">${m.emoji}</div>`).join('')}</div></div></div><button class="primary full" onclick="candidates()">가능시간 확인하기</button></div>`)}
function pick(el){el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function pickValue(key,value,el){state.draft=state.draft||{};state.draft[key]=value;el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function getAvailabilitySummary(d){const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),all=readJSON('gyeongjin_schedules',{}),month=all[ym]||{};const notes=[];Object.keys(month).forEach(day=>Object.entries(month[day]||{}).forEach(([name,note])=>{if(note)notes.push(name+' · '+note)}));return notes.length?'이번 달 일정 '+notes.length+'건을 참고했어요.':'등록된 개인 일정이 없어 기본 후보를 표시해요.'}
function candidates(){const d=state.draft||{period:'이번 주',day:'토',time:'오후 1시 ~ 6시'};const dayNum=d.day==='평일'?null:(d.day==='토'?6:0);const slots=getCommonSlots().filter(x=>{if(dayNum===null)return true;return new Date(new Date().getFullYear(),new Date().getMonth(),Number(x.day)).getDay()===dayNum});const shown=slots.slice(0,5);state.candidateSlots=shown;shell('<div class="page"><button class="ghost back" onclick="create()">← 이전</button><div class="eyebrow">STEP 2 / 3</div><h1 class="title">모두 가능한 시간이에요</h1><p class="sub">가족 일정에서 입력한 시간을 기준으로 실제 공통 가능 시간을 계산했습니다.</p><div class="card"><b>공통 가능 시간</b><p class="label">'+esc(shown.length?shown.map(x=>x.day+'일 '+x.start+'~'+x.end).join(', '):'아직 가족 모두가 가능한 시간이 없습니다.')+'</p></div><div class="card">'+(shown.length?shown.map((x,i)=>'<div class="event"><div class="row"><b>후보 '+(i+1)+'</b><span class="tag">'+x.day+'일</span></div><small>'+x.start+' ~ '+x.end+' · 가족 '+family.members.length+'명 모두 가능</small></div>').join(''):'<div class="event"><b>공통 가능 시간이 없어요</b><br><small>가족 일정에서 각자의 상태를 "가능"으로 입력하고 시작·종료 시간을 확인해주세요.</small></div>')+'</div><button class="primary full" onclick="candidateForm()" '+(shown.length?'':'disabled')+'>후보 활동 정하기</button></div>')}
function candidateForm(){const slots=Array.isArray(state.candidateSlots)&&state.candidateSlots.length?state.candidateSlots:getCommonSlots().slice(0,5);shell('<div class="page"><button class="ghost back" onclick="candidates()">← 이전</button><div class="eyebrow">STEP 3 / 3</div><h1 class="title">무엇을 할까요?</h1><p class="sub">공통 가능 시간 중에서 가족시간 후보를 만들어요.</p><div class="card"><div class="field"><label>가족시간 시간</label><select id="candidateSlot">'+slots.map((x,i)=>'<option value="'+i+'">'+x.day+'일 '+x.start+' ~ '+x.end+'</option>').join('')+'</select></div><div class="field"><label>후보 1</label><input value="서울숲 산책 + 카페"></div><div class="field"><label>후보 2</label><input value="국립중앙박물관"></div><div class="field"><label>후보 3</label><input value="집에서 영화 + 피자"></div><div class="field"><label>가족에게 전할 한마디</label><textarea placeholder="이번에는 다 같이 편하게 보내자 :) "></textarea></div></div><button class="primary full" onclick="startFamilyVote()">가족 투표 시작하기</button></div>')}
function startFamilyVote(){const inputs=[...document.querySelectorAll('.card input')].map(x=>x.value.trim()).filter(Boolean);const candidates=[...new Set(inputs.slice(0,3))];if(candidates.length<2){toast('가족이 비교할 후보를 2개 이상 입력해주세요');return}const message=document.querySelector('.card textarea')?.value.trim()||'';const slots=Array.isArray(state.candidateSlots)&&state.candidateSlots.length?state.candidateSlots:getCommonSlots();const slot=slots[Number(document.querySelector('#candidateSlot')?.value||0)]||slots[0];if(!slot){toast('공통 가능 시간을 먼저 확인해주세요');return}const d=state.draft||{period:'이번 주',day:'토'};const dayLabel=d.day==='토'?'토요일':d.day==='일'?'일요일':'평일';state.event={title:'가족시간 · '+dayLabel,candidates,date:d.period+' · '+slot.day+'일',time:slot.start+' ~ '+slot.end,votes:{},finalized:false,finalCandidate:'',message,period:d.period,day:d.day,timeRange:slot.start+'~'+slot.end,slot};localStorage.setItem('gyeongjin_event',JSON.stringify(state.event));state.selected=[];state.draft=null;vote()}
function vote(){if(state.event?.finalized){detail();return}const ev=state.event||{title:'가족시간',date:'10/3 토요일',time:'오후 2:00',candidates:['서울숲 산책 + 카페','국립중앙박물관','집에서 영화 + 피자']};const names=ev.candidates||[];const currentMember=localStorage.getItem('gyeongjin_current_member')||family.members[0]?.name||'';state.selected=Array.isArray(ev.votes?.[currentMember])?[...ev.votes[currentMember]]:[];shell(`<div class="page"><div class="eyebrow">가족시간 결정</div><h1 class="title">각자 마음에 드는 걸 골라주세요</h1><p class="sub">가족 구성원을 선택한 뒤 마음에 드는 후보를 골라주세요. 가족별 선택은 따로 저장됩니다.</p><div class="card"><div class="field"><label>지금 투표하는 가족</label><select id="voteMember" onchange="changeVoteMember(this.value)">${family.members.map(m=>`<option ${m.name===currentMember?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div><div class="card">${names.map((n,i)=>{const k=String.fromCharCode(97+i);return `<div class="vote"><div><b>${n}</b><br><small>${ev.date} · ${ev.time}</small></div><button class="check ${state.selected.includes(k)?'on':''}" onclick="toggleVote('${k}',this)">${state.selected.includes(k)?'✓':'○'}</button></div>${i<names.length-1?'<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">':''}`}).join('')}</div><button class="primary full" onclick="voteDone()">내 선택 저장</button></div>`)}

function changeVoteMember(name){localStorage.setItem('gyeongjin_current_member',name);vote()}
function toggleVote(k,b){state.selected=state.selected.includes(k)?state.selected.filter(x=>x!==k):[...state.selected,k];b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':'○'}
function voteDone(){const member=$('#voteMember')?.value||family.members[0]?.name||'';if(!member){toast('투표할 가족 구성원을 선택해주세요');return}if(!state.selected.length){toast('후보를 하나 이상 선택해주세요');return}state.event=state.event||{};state.event.votes=state.event.votes||{};state.event.votes[member]=[...state.selected];localStorage.setItem('gyeongjin_current_member',member);localStorage.setItem('gyeongjin_event',JSON.stringify(state.event));state.selected=[];toast(member+' 의견이 저장됐어요');setTimeout(()=>result(),700)}
function result(){const ev=state.event||{title:"가족시간",candidates:["서울숲 산책 + 카페","국립중앙박물관","집에서 영화 + 피자"],votes:{}};const names=ev.candidates||[];const counts=names.map((_,i)=>{const k=String.fromCharCode(97+i);return Object.values(ev.votes||{}).filter(v=>Array.isArray(v)&&v.includes(k)).length});const max=Math.max(1,...counts);const voterCount=Object.keys(ev.votes||{}).length;const memberCount=family.members.length;shell(`<div class="page"><div class="eyebrow">투표 결과</div><h1 class="title">가족 의견을 모았어요</h1><p class="sub">현재 ${voterCount}명 / 가족 ${memberCount}명이 투표했어요. 결과를 보고 함께 이야기한 뒤 부모가 최종 확정합니다.</p><div class="card">${names.map((n,i)=>{const count=counts[i];const width=Math.max(8,Math.round(count/max*100));return `<div style="margin:14px 0"><b>${n}</b><div class="progress" style="margin:9px 0"><i style="width:${width}%"></i></div><small>${count}표</small></div>`}).join("")}</div><button class="secondary full" onclick="vote()">가족 구성원 투표 이어하기</button><button class="primary full" onclick="familyDiscuss()">가족과 이야기하고 최종 확정하기</button></div>`);}
function familyDiscuss(){const ev=state.event;if(!ev||!ev.candidates?.length){toast('먼저 가족시간을 만들어주세요');return}if(ev.finalized){detail();return}const parents=family.members.filter(m=>m.admin||m.role==='부모');if(!parents.length){toast('최종 결정을 담당할 부모가 등록되어 있지 않아요');return}const current=localStorage.getItem('gyeongjin_current_member')||'';const currentParent=parents.some(m=>m.name===current)?current:parents[0].name;const counts=ev.candidates.map((_,i)=>{const k=String.fromCharCode(97+i);return Object.values(ev.votes||{}).filter(v=>Array.isArray(v)&&v.includes(k)).length});const voterCount=Object.keys(ev.votes||{}).length;const memberCount=family.members.length;shell(`<div class="page"><button class="ghost back" onclick="result()">← 투표 결과</button><div class="eyebrow">부모 최종 결정</div><h1 class="title">이제 같이 이야기해요</h1><p class="sub">투표 결과는 참고자료예요. 가족의 상황과 의견을 함께 보고 부모가 최종 시간을 확정합니다.</p><div class="card"><b>투표 현황</b><p class="label">현재 ${voterCount}명 / 가족 ${memberCount}명이 투표했어요.</p>${ev.candidates.map((n,i)=>`<div class="event"><div class="row"><b>${n}</b><span class="tag">${counts[i]}표</span></div><small>투표 결과를 참고해서 가족끼리 이야기해 보세요.</small></div>`).join('')}</div><div class="card"><div class="field"><label>최종 결정하는 부모</label><select id="finalParent" onchange="localStorage.setItem('gyeongjin_current_member',this.value)">${parents.map(m=>`<option ${m.name===currentParent?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>협의한 최종 활동</label><select id="finalChoice">${ev.candidates.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('')}</select></div></div><div class="card"><b>협의 체크</b><p class="label" style="line-height:1.7">• 모두 가능한지 확인하기<br>• 이동·비용·컨디션 확인하기<br>• 다른 의견이 있는지 듣기<br>• 합의한 활동을 부모가 최종 확정하기</p></div><button class="primary full" onclick="finalizeDiscussedEvent()">협의한 가족시간 최종 확정</button></div>`)}
function finalizeDiscussedEvent(){const ev=state.event;if(!ev?.candidates?.length){toast('먼저 가족시간을 만들어주세요');return}const parentName=$('#finalParent')?.value||'';const parent=family.members.find(m=>m.name===parentName&&(m.admin===true||m.role==='부모'));if(!parent){toast('부모 구성원만 최종 확정할 수 있어요');return}const idx=Number($('#finalChoice')?.value);if(!Number.isInteger(idx)||!ev.candidates[idx]){toast('최종 활동을 선택해주세요');return}ev.finalized=true;ev.finalCandidate=ev.candidates[idx];ev.finalizedBy=parent.name;state.event=ev;localStorage.setItem('gyeongjin_current_member',parent.name);localStorage.setItem('gyeongjin_event',JSON.stringify(ev));toast(parent.name+'님이 가족시간을 확정했어요');setTimeout(detail,500)}

function finalizeEvent(){const ev=state.event;if(!ev||!ev.candidates?.length){toast('먼저 가족시간을 만들어주세요');return}toast('투표 결과만으로는 확정하지 않아요. 가족 협의 후 최종 활동을 선택해주세요');setTimeout(familyDiscuss,450)}
function detail(){const ev=state.event||{title:'가족시간',date:'10월 3일 토요일',time:'오후 2:00'};const memberCount=family.members.length;const members=family.members;shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">${ev.finalized?'가족시간 확정':'가족시간 상세'}</div><h1 class="title">${ev.finalized?ev.finalCandidate:ev.title}</h1><p class="sub">${ev.date} · ${ev.time}</p><div class="card"><div class="row"><b>참여 가족</b><span class="tag">${memberCount}명</span></div><div style="margin-top:12px" class="member">${members.map(m=>`<div class="avatar">${m.emoji}</div>`).join('')}</div></div><div class="card"><b>가족에게 전한 한마디</b><p class="label">${esc(ev.message||'함께할 활동을 가족과 정해봐요.')}</p></div><div class="card"><b>오늘의 기록</b><p class="label">사진과 각자의 한마디를 남기면 이 시간이 가족의 추억이 됩니다.</p><button class="secondary full" onclick="record()">활동 기록하기</button></div></div>`)}
function record(){shell(`<div class="page"><button class="ghost back" onclick="detail()">← 이전</button><div class="eyebrow">추억 기록</div><h1 class="title">오늘 어땠나요?</h1><div class="card"><div class="field"><label>사진</label><input id="memoryPhoto" type="file" accept="image/*" onchange="previewPhoto(this)"><div id="photoPreview" style="height:130px;margin-top:9px;border:1px dashed #d8cabc;border-radius:16px;display:grid;place-items:center;color:var(--muted)">＋ 사진을 선택하면 미리보여요</div></div><div class="field"><label>나의 한마디</label><textarea placeholder="오늘 제일 좋았던 순간은..."></textarea></div><div class="field"><label>오늘의 기분</label><div class="choice"><button onclick="pick(this)">😍 최고</button><button class="sel" onclick="pick(this)">😊 좋음</button><button onclick="pick(this)">😐 보통</button><button onclick="pick(this)">🥱 피곤</button></div></div></div><button class="primary full" onclick="saveMemory()">추억에 저장하기</button></div>`)}
function previewPhoto(input){const box=$('#photoPreview');const file=input&&input.files&&input.files[0];if(!box||!file)return;const url=URL.createObjectURL(file);box.innerHTML='<img src="'+url+'" alt="추억 사진 미리보기" style="width:100%;height:100%;object-fit:cover;border-radius:15px">';box.dataset.photoName=file.name}
function compressPhoto(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const max=1200;const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',0.78))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image load failed'))};img.src=url})}
function formatMemoryDate(){const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
async function saveMemory(){const ev=state.event||{title:'가족시간',date:'2026.10.03'};const text=$('textarea')?.value.trim()||'오늘 함께 걷고 웃었던 시간을 남겼어요.';const mood=[...document.querySelectorAll('.choice button.sel')].pop()?.textContent.trim()||'😊 좋음';const file=$('#memoryPhoto')?.files?.[0];let photoData='';if(file){try{photoData=await compressPhoto(file)}catch(e){toast('사진을 읽지 못했어요');return}}const memory={title:ev.finalized?ev.finalCandidate:ev.title,date:ev.date||formatMemoryDate(),text,mood,photoName:file?.name||'',photoData};const next=[memory,...state.memories];try{localStorage.setItem('gyeongjin_memories',JSON.stringify(next));state.memories=next}catch(e){toast('사진 저장 공간이 부족해요. 더 작은 사진으로 다시 시도해주세요');return}toast('사진과 가족 추억을 저장했어요');setTimeout(memories,700)}
function memories(){nav('memory');shell(`<div class="page"><div class="eyebrow">우리 가족</div><h1 class="title">추억</h1><p class="sub">함께 보낸 시간이 차곡차곡 쌓여요.</p>${state.memories.map(m=>`<div class="memory"><div class="fakephoto">${m.photoData?`<img src="${m.photoData}" alt="가족 추억 사진" style="width:100%;height:100%;object-fit:cover">`:m.photoName?"🖼️":"📷"}</div><div class="body"><b>${esc(m.title)}</b><br><small>${esc(m.date)} · ${esc(m.mood)}${m.photoName?" · 사진 첨부":""}</small><p style="line-height:1.5">${esc(m.text)}</p></div></div>`).join('')}</div>`)}
const savedFamily=readJSON('gyeongjin_family_members',null);
const family={members:Array.isArray(savedFamily)&&savedFamily.length?savedFamily:[{name:'아빠',role:'부모',admin:true,emoji:'👤'},{name:'엄마',role:'부모',admin:true,emoji:'👤'},{name:'첫째',role:'자녀',admin:false,emoji:'👧'},{name:'둘째',role:'자녀',admin:false,emoji:'👧'},{name:'셋째',role:'자녀',admin:false,emoji:'👧'}]};
let newMemberRole='자녀';
function show(p){if(p==='profile'){familyScreen()}}
function familyScreen(){updateFamilyCount();shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">가족 관리</div><h1 class="title">우리 가족</h1><p class="sub">부모가 가족 구성원을 등록하고 관리해요.</p><div class="card">${family.members.map((m,i)=>`<div class="row" style="margin:12px 0"><div class="member"><div class="avatar">${m.emoji}</div><div><b>${m.name}</b><div class="label">${m.role}${m.admin?' · 관리자':''}</div></div></div>${m.admin?'<span class="tag">관리</span>':'<span class="label">참여</span>'}</div>`).join('')}</div><button class="primary full" onclick="addFamilyMember()">+ 가족 구성원 등록</button><div class="card"><b>권한 안내</b><p class="label" style="line-height:1.6;margin-bottom:0">부모: 가족 구성원 등록·관리, 가족시간 최종 결정<br>자녀: 가족시간 참여·투표, 추억 기록</p></div><div class="card"><b>초기모델 테스트</b><p class="label">실제 흐름을 바로 확인할 수 있도록 공통 가능 시간 테스트 데이터를 넣거나 전체 테스트 데이터를 초기화할 수 있어요.</p><button class="primary full" onclick="seedFamilyAppTestData()">테스트 데이터 넣기</button><button class="secondary full" style="margin-top:8px" onclick="resetFamilyAppData()">테스트 데이터 초기화</button></div></div>`)}
function addFamilyMember(){newMemberRole='자녀';shell(`<div class="page"><button class="ghost back" onclick="familyScreen()">← 가족 관리</button><div class="eyebrow">가족 구성원 등록</div><h1 class="title">누구를 추가할까요?</h1><p class="sub">MVP에서는 부모가 직접 가족 구성원을 등록해요.</p><div class="card"><div class="field"><label>이름</label><input id="memberName" placeholder="예: 막내"></div><div class="field"><label>역할</label><div class="choice"><button class="sel" onclick="pickFamilyRole('자녀',this)">자녀</button><button onclick="pickFamilyRole('부모',this)">부모</button></div></div></div><button class="primary full" onclick="saveFamilyMember()">가족 구성원 저장</button></div>`)}
function pickFamilyRole(role,el){newMemberRole=role;el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function saveFamilyMember(){const n=$('#memberName').value.trim();if(!n){toast('이름을 입력해주세요');return}const isParent=newMemberRole==='부모';family.members.push({name:n,role:newMemberRole,admin:isParent,emoji:isParent?'👤':'👧'});localStorage.setItem('gyeongjin_family_members',JSON.stringify(family.members));toast(n+' 가족 구성원을 등록했어요');setTimeout(familyScreen,500)}
normalizeState();
home();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
