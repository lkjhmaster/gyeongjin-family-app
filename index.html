<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf4"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192-v2.png" type="image/png"><link rel="apple-touch-icon" href="/icon-192-v2.png">
<title>경진훈주시라</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#26231f;--muted:#82796f;--line:#eee5da;--accent:#e88963;--accent2:#6f9c8b;--soft:#f7eee5;--danger:#c76d6d}*{box-sizing:border-box}body{margin:0;background:#f1ece6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:82px}.top{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}.page{padding:8px 20px 20px}.eyebrow{color:var(--accent);font-weight:800;font-size:13px;margin:8px 0}.title{font-size:28px;line-height:1.25;margin:0 0 8px}.sub{color:var(--muted);line-height:1.55;margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 3px 12px rgba(80,50,20,.04)}.hero{background:linear-gradient(135deg,#fff0e6,#fffaf4)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);padding:14px;border-radius:16px}.stat b{display:block;font-size:22px;margin-bottom:3px}.label{font-size:12px;color:var(--muted)}button,.btn{border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--ink)}.ghost{background:transparent;color:var(--muted)}.full{width:100%}.section-title{font-size:17px;font-weight:900;margin:22px 0 10px}.event{padding:15px;border:1px solid var(--line);border-radius:17px;margin:9px 0;background:#fff}.event small{color:var(--muted)}.tag{display:inline-block;background:#f2eee9;border-radius:999px;padding:6px 9px;margin:4px 3px 0 0;font-size:12px}.member{display:flex;align-items:center;gap:10px}.schedule-row>.row>b{min-width:42px;white-space:nowrap;word-break:keep-all}.schedule-row>.row select{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}.cal-day{min-height:64px;padding:7px 4px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.cal-day.empty{visibility:hidden}.cal-day .num{font-size:13px;font-weight:900}.cal-icons{font-size:13px;line-height:1.2;margin-top:7px;word-break:keep-all}.day-member{width:100%;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);margin:7px 0;text-align:left}.schedule-item{display:grid;grid-template-columns:minmax(108px,max-content) minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.schedule-item>b{white-space:nowrap;font-size:14px}.schedule-item>span{min-width:0;overflow-wrap:anywhere;line-height:1.4}.schedule-item>button{white-space:nowrap;padding:8px 6px}.schedule-item:last-child{border-bottom:0}@media(max-width:380px){.schedule-item{grid-template-columns:1fr auto}.schedule-item>b{grid-column:1}.schedule-item>span{grid-column:1}.schedule-item>button{grid-column:2;grid-row:1/3}}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f0d6c5;font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:rgba(255,250,244,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.nav button{background:none;color:var(--muted);border-radius:0}.nav button.active{color:var(--accent)}.nav span{display:block;font-size:11px;margin-top:3px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;font:inherit;color:var(--ink);outline:none}textarea{min-height:90px;resize:vertical}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;font-weight:700}.choice button.sel{border-color:var(--accent);background:#fff0e6;color:#a9532e}.back{margin-bottom:8px}.progress{height:7px;background:#eee5da;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:75%}.vote{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.check{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;background:#fff}.check.on{background:var(--accent);color:#fff}.memory{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0}.memory .fakephoto{height:170px;background:linear-gradient(135deg,#e7d2bd,#c5d5cb);display:grid;place-items:center;font-size:44px}.memory .body{padding:15px}.album{position:relative;height:190px;border-radius:18px;overflow:hidden;background:var(--soft);display:grid;place-items:center;margin-bottom:12px}.album img{width:100%;height:100%;object-fit:cover}.album-empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.album-count{position:absolute;right:10px;bottom:10px;background:rgba(38,35,31,.72);color:#fff;border-radius:999px;padding:5px 9px;font-size:11px}.album-actions{display:grid;grid-template-columns:1fr auto;gap:8px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#2c2925;color:#fff;padding:11px 15px;border-radius:12px;display:none;font-size:13px;z-index:20}.hide{display:none!important}
</style></head>
<body><div id="bootFallback" style="max-width:480px;margin:auto;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:#26231f"><b>경진훈주시라</b><p style="color:#82796f;line-height:1.6">앱을 불러오는 중입니다…</p></div><div class="app"><header class="top"><div class="brand">경진훈주시라</div><div style="display:flex;gap:6px"><button id="installBtn" class="pill hide" onclick="installApp()">앱 설치</button><button id="approvalBtn" class="pill hide" onclick="passwordApprovalScreen()">승인 요청</button><button id="loginBtn" class="pill" onclick="setupScreen()">로그인</button><button id="familyCount" class="pill" onclick="show('profile')">가족 5명</button></div></header><main id="main"></main><nav class="nav"><button id="nav-home" onclick="home()">⌂<span>홈</span></button><button id="nav-create" onclick="create()">＋<span>가족시간</span></button><button id="nav-memory" onclick="memories()">♡<span>추억</span></button></nav></div><div id="toast" class="toast"></div>
<script>
const API_BASE='https://gyeongjin-family-api.muse-hooni.workers.dev';
let currentAccount=null;
const SYNC_KEYS={daily_schedules:'gyeongjin_daily_schedules',family_schedules:'gyeongjin_family_schedules',monthly_memos:'gyeongjin_monthly_memos',event:'gyeongjin_event',memories:'gyeongjin_memories',member_albums:'gyeongjin_member_albums',profile_photos:'gyeongjin_profile_photos',allowance_ledger:'gyeongjin_allowance_ledger',allowance_audit:'gyeongjin_allowance_audit'};
function authToken(){return sessionStorage.getItem('gyeongjin_auth_token')||''}
async function api(path,options={}){const headers={'content-type':'application/json',...(options.headers||{})},token=authToken();if(token)headers.authorization='Bearer '+token;const res=await fetch(API_BASE+path,{...options,headers});let data={};try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data.error||'서버 요청에 실패했습니다.');return data}
async function apiStatus(){try{return await api('/api/health')}catch(e){return null}}
async function loginMember(){const name=$('#loginName')?.value.trim(),password=$('#loginPassword')?.value||'';if(!name||!password){toast('이름과 비밀번호를 입력해주세요');return}try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({name,password})});sessionStorage.setItem('gyeongjin_auth_token',r.token);currentAccount=r.member;localStorage.setItem('gyeongjin_current_member',r.member.name);await pullFamilyState();await syncFamilyMembers();toast(r.member.name+'님, 반가워요');home()}catch(e){toast(e.message)}}
function logoutMember(){currentAccount=null;sessionStorage.removeItem('gyeongjin_auth_token');localStorage.removeItem('gyeongjin_current_member');loginScreen()}
function accountSettings(){const current=localStorage.getItem('gyeongjin_current_member')||'',admin=currentAccount?.isAdmin===true;shell('<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">ACCOUNT</div><h1 class="title">내 계정 설정</h1><p class="sub">처음 등록한 이름과 비밀번호는 언제든 변경할 수 있어요.</p><div class="card"><div class="field"><label>이름</label><input id="accountName" value="'+esc(current)+'" autocomplete="name"></div><button class="secondary full" onclick="changeMyName()">이름 변경</button><div class="field" style="margin-top:18px"><label>새 비밀번호</label><input id="accountPassword" type="password" minlength="4" autocomplete="new-password" placeholder="4자 이상"></div><button class="secondary full" onclick="changeMyPassword()">비밀번호 변경</button></div>'+(admin?'<button class="secondary full" onclick="familyAccountManager()">가족 계정 관리</button><button class="secondary full" onclick="passwordApprovalScreen()">자녀 비밀번호 승인 요청</button>':'')+'<button class="ghost full" onclick="logoutMember()">로그아웃</button></div>')}
async function migrateMemberNameData(oldName,newName){if(!oldName||!newName||oldName===newName)return;const schedules=scheduleStore();Object.values(schedules).forEach(month=>Object.values(month||{}).forEach(day=>{if(day&&Object.prototype.hasOwnProperty.call(day,oldName)){if(!Object.prototype.hasOwnProperty.call(day,newName))day[newName]=day[oldName];delete day[oldName]}}));localStorage.setItem('gyeongjin_daily_schedules',JSON.stringify(schedules));const albums=memberAlbumStore();if(Object.prototype.hasOwnProperty.call(albums,oldName)){if(!Object.prototype.hasOwnProperty.call(albums,newName))albums[newName]=albums[oldName];delete albums[oldName];localStorage.setItem('gyeongjin_member_albums',JSON.stringify(albums))}const photos=profilePhotoStore();if(Object.prototype.hasOwnProperty.call(photos,oldName)){if(!Object.prototype.hasOwnProperty.call(photos,newName))photos[newName]=photos[oldName];delete photos[oldName];localStorage.setItem('gyeongjin_profile_photos',JSON.stringify(photos))}const ev=readJSON('gyeongjin_event',null);if(ev){let changed=false;if(ev.votes&&Object.prototype.hasOwnProperty.call(ev.votes,oldName)){if(!Object.prototype.hasOwnProperty.call(ev.votes,newName))ev.votes[newName]=ev.votes[oldName];delete ev.votes[oldName];changed=true}if(Array.isArray(ev.participants)&&ev.participants.includes(oldName)){ev.participants=[...new Set(ev.participants.map(n=>n===oldName?newName:n))];changed=true}if(ev.finalizedBy===oldName){ev.finalizedBy=newName;changed=true}if(ev.createdBy===oldName){ev.createdBy=newName;changed=true}if(changed){state.event=ev;localStorage.setItem('gyeongjin_event',JSON.stringify(ev))}}const allowance=allowanceStore();if(Object.prototype.hasOwnProperty.call(allowance,oldName)){if(!Object.prototype.hasOwnProperty.call(allowance,newName))allowance[newName]=allowance[oldName];else allowance[newName]=[...(Array.isArray(allowance[newName])?allowance[newName]:[]),...(Array.isArray(allowance[oldName])?allowance[oldName]:[])];delete allowance[oldName];localStorage.setItem('gyeongjin_allowance_ledger',JSON.stringify(allowance))}if(localStorage.getItem('gyeongjin_allowance_child')===oldName)localStorage.setItem('gyeongjin_allowance_child',newName);if(localStorage.getItem('gyeongjin_current_member')===oldName)localStorage.setItem('gyeongjin_current_member',newName);await Promise.all(['daily_schedules','member_albums','profile_photos','event','allowance_ledger'].map(k=>pushFamilyStateKey(k)));await syncFamilyMembers()}
async function changeMyName(){const old=localStorage.getItem('gyeongjin_current_member')||'',name=$('#accountName')?.value.trim();if(!name){toast('이름을 입력해주세요');return}if(name===old)return;try{const r=await api('/api/account',{method:'PUT',body:JSON.stringify({name})});currentAccount=r.member;await migrateMemberNameData(old,r.member.name);updateFamilyCount();toast('이름과 기존 가족 데이터를 함께 변경했어요');accountSettings()}catch(e){toast(e.message)}}
async function changeMyPassword(){const password=$('#accountPassword')?.value||'';if(password.length<4){toast('새 비밀번호는 4자 이상 입력해주세요');return}try{const r=await api('/api/account',{method:'PUT',body:JSON.stringify({password})});toast(r.pendingApproval?(r.message||'부모님께 비밀번호 변경 승인을 요청했어요'):'비밀번호를 변경했어요')}catch(e){toast(e.message)}}

async function familyAccountManager(){if(!authToken()){loginScreen();return}try{const r=await api('/api/members');const rows=(r.members||[]).map(m=>'<div class="event"><div class="row"><b>'+esc(m.emoji||'🙂')+' '+esc(m.name)+'</b><span class="tag">'+(m.role==='parent'?'부모 관리자':'자녀')+'</span></div><div class="row" style="margin-top:10px;gap:8px"><button class="ghost" style="flex:1" onclick="renameFamilyMember(\''+m.id+'\',\''+encodeURIComponent(m.name)+'\')">이름 변경</button><button class="ghost" style="flex:1" onclick="changeFamilyMemberEmoji(\''+m.id+'\',\''+encodeURIComponent(m.name)+'\',\''+encodeURIComponent(m.emoji||'🙂')+'\')">아이콘 변경</button><button class="ghost" style="flex:1" onclick="resetFamilyMemberPassword(\''+m.id+'\')">비밀번호 재설정</button></div></div>').join('');shell('<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">FAMILY ACCOUNTS</div><h1 class="title">가족 계정 관리</h1><p class="sub">부모 관리자가 가족 계정을 만들고 관리합니다. 우리 가족은 부모 2명과 자녀 3명, 총 5명으로 사용합니다.</p><div class="card"><div class="field"><label>이름</label><input id="newMemberName" placeholder="가족 이름"></div><div class="field"><label>구분</label><select id="newMemberRole"><option value="child">자녀</option><option value="parent">부모 관리자</option></select></div><div class="field"><label>아이콘</label><input id="newMemberEmoji" value="🙂" maxlength="4"></div><div class="field"><label>초기 비밀번호</label><input id="newMemberPassword" type="password" minlength="4" placeholder="4자 이상"></div><button class="primary full" onclick="createFamilyMember()">가족 계정 추가</button></div><h2 class="section-title">등록된 가족</h2>'+rows+'</div>')}catch(e){toast(e.message);accountSettings()}}
async function createFamilyMember(){const name=$('#newMemberName')?.value.trim(),role=$('#newMemberRole')?.value,emoji=$('#newMemberEmoji')?.value.trim()||'🙂',password=$('#newMemberPassword')?.value||'';if(!name||password.length<4){toast('이름과 4자 이상 비밀번호를 입력해주세요');return}try{await api('/api/members',{method:'POST',body:JSON.stringify({name,role,emoji,password})});toast(name+' 계정을 만들었어요');await syncFamilyMembers();familyAccountManager()}catch(e){toast(e.message)}}
async function renameFamilyMember(memberId,encoded){const old=decodeURIComponent(encoded),name=prompt(old+'님의 새 이름을 입력해주세요.',old);if(!name||name.trim()===old)return;try{await api('/api/members/account',{method:'PUT',body:JSON.stringify({memberId,name:name.trim()})});await migrateMemberNameData(old,name.trim());toast('이름과 기존 가족 데이터를 함께 변경했어요');familyAccountManager()}catch(e){toast(e.message)}}
async function changeFamilyMemberEmoji(memberId,encoded,currentEmoji){const name=decodeURIComponent(encoded),next=prompt(name+'님의 아이콘을 입력해주세요.\n이모지 1개를 권장해요.',decodeURIComponent(currentEmoji)||'🙂');if(next===null)return;const emoji=Array.from(next.trim()).slice(0,2).join('');if(!emoji){toast('아이콘을 입력해주세요');return}try{await api('/api/members/account',{method:'PUT',body:JSON.stringify({memberId,emoji})});await syncFamilyMembers();toast(name+' 아이콘을 변경했어요');familyAccountManager()}catch(e){toast(e.message)}}
async function resetFamilyMemberPassword(memberId){const password=prompt('새 비밀번호를 입력해주세요. (4자 이상)');if(password===null)return;if(password.length<4){toast('비밀번호는 4자 이상이어야 합니다');return}try{await api('/api/members/account',{method:'PUT',body:JSON.stringify({memberId,password})});toast('비밀번호를 재설정했어요')}catch(e){toast(e.message)}}
async function passwordApprovalScreen(){if(!authToken()){loginScreen();return}try{const r=await api('/api/password-requests');const rows=(r.requests||[]).map(x=>'<div class="event"><div class="row"><b>'+esc(x.emoji||'🙂')+' '+esc(x.name)+'</b><span class="tag">승인 대기</span></div><small>비밀번호 변경 요청</small><div class="row" style="margin-top:12px;gap:8px"><button class="secondary" style="flex:1" onclick="reviewPasswordRequest(\''+x.id+'\',\'approve\')">승인</button><button class="ghost" style="flex:1" onclick="reviewPasswordRequest(\''+x.id+'\',\'reject\')">거절</button></div></div>').join('');shell('<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">PARENT APPROVAL</div><h1 class="title">비밀번호 승인 요청</h1><p class="sub">자녀가 요청한 비밀번호 변경을 부모가 확인합니다.</p>'+(rows||'<div class="card"><b>대기 중인 요청이 없어요.</b></div>')+'</div>')}catch(e){toast(e.message);accountSettings()}}
async function reviewPasswordRequest(requestId,action){try{await api('/api/password-requests/review',{method:'POST',body:JSON.stringify({requestId,action})});toast(action==='approve'?'비밀번호 변경을 승인했어요':'비밀번호 변경을 거절했어요');passwordApprovalScreen()}catch(e){toast(e.message)}}
async function refreshApprovalBadge(){if(!authToken()||currentAccount?.isAdmin!==true){const btn=$('#approvalBtn');if(btn)btn.classList.add('hide');return}try{const r=await api('/api/password-requests');const btn=$('#approvalBtn');if(btn){btn.classList.remove('hide');btn.textContent='승인 요청 '+(r.requests||[]).length+'건'}}catch(e){}}

async function setupScreen(){try{const s=await api('/api/setup-status');if(s.initialized){loginScreen();return}}catch(e){toast('서버 연결을 확인해주세요');return}nav('home');shell('<div class="page"><div class="eyebrow">FIRST SETUP</div><h1 class="title">우리 가족 시작하기</h1><p class="sub">첫 부모 관리자 계정을 만듭니다. 이름과 비밀번호는 나중에 변경할 수 있어요.</p><div class="card"><div class="field"><label>가족 이름</label><input id="setupFamily" value="경진훈주시라"></div><div class="field"><label>부모 이름</label><input id="setupParent" value="후니요"></div><div class="field"><label>비밀번호</label><input id="setupPassword" type="password" minlength="4" autocomplete="new-password" placeholder="4자 이상"></div><button class="primary full" onclick="createFamilyAccount()">첫 부모 계정 만들기</button></div><p class="label">비밀번호는 이 화면에서만 입력하며 채팅으로 보낼 필요가 없습니다.</p></div>')}
async function createFamilyAccount(){const familyName=$('#setupFamily')?.value.trim(),parentName=$('#setupParent')?.value.trim(),password=$('#setupPassword')?.value||'';if(!familyName||!parentName||password.length<4){toast('가족명·부모 이름·4자 이상 비밀번호를 확인해주세요');return}try{const r=await api('/api/setup',{method:'POST',body:JSON.stringify({familyName,parentName,password,emoji:'👨'})});sessionStorage.setItem('gyeongjin_auth_token',r.token);currentAccount=r.member;localStorage.setItem('gyeongjin_current_member',r.member.name);toast('첫 부모 관리자 계정을 만들었어요');home()}catch(e){toast(e.message)}}
function loginScreen(){if(authToken()){accountSettings();return}nav('home');shell('<div class="page"><div class="eyebrow">FAMILY LOGIN</div><h1 class="title">경진훈주시라</h1><p class="sub">가족 계정으로 로그인하면 같은 일정과 추억을 함께 사용할 수 있어요.</p><div class="card"><div class="field"><label>이름</label><input id="loginName" autocomplete="username" placeholder="가족 구성원 이름"></div><div class="field"><label>비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호"></div><button class="primary full" onclick="loginMember()">로그인</button></div><button class="ghost full" onclick="home()">아직은 이 기기 데이터로 사용</button></div>')}

const $=s=>document.querySelector(s);function readJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch(e){return fallback}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1600)}

function addFamilySchedule(y,m,day){const start=$('#familyStart')?.value,end=$('#familyEnd')?.value,title=$('#familyTitle')?.value.trim();if(!title){toast('가족 일정명을 입력해주세요');return}if(start>=end){toast('종료 시간은 시작 시간보다 늦어야 해요');return}const ym=monthKey(y,m),d=dayKey(day),all=familyScheduleStore(),items=familyDayItems(ym,d);if(items.some(it=>start<it.end&&end>it.start)){toast('이미 등록된 가족 일정과 시간이 겹쳐요');return}all[ym]=all[ym]||{};all[ym][d]=[...items,{start,end,title}].sort((a,b)=>a.start.localeCompare(b.start));localStorage.setItem('gyeongjin_family_schedules',JSON.stringify(all));pushFamilyStateKey('family_schedules');toast('가족 전체 일정을 저장했어요');daySchedule(y,m,day)}
function deleteFamilySchedule(y,m,day,index){const ym=monthKey(y,m),d=dayKey(day),all=familyScheduleStore(),items=familyDayItems(ym,d);items.splice(index,1);all[ym]=all[ym]||{};if(items.length)all[ym][d]=items;else delete all[ym][d];localStorage.setItem('gyeongjin_family_schedules',JSON.stringify(all));pushFamilyStateKey('family_schedules');toast('가족 일정을 삭제했어요');daySchedule(y,m,day)}
function monthlyMemoStore(){return readJSON('gyeongjin_monthly_memos',{})}
function saveMonthlyMemo(y,m){const ym=monthKey(y,m),el=$('#monthlyMemo'),all=monthlyMemoStore();if(!el)return;const value=el.value.trim();if(value)all[ym]=value;else delete all[ym];localStorage.setItem('gyeongjin_monthly_memos',JSON.stringify(all));pushFamilyStateKey('monthly_memos');toast(value?'이번 달 메모를 저장했어요':'이번 달 메모를 비웠어요')}
function monthKey(y,m){return y+'-'+String(m+1).padStart(2,'0')}

function memberDayData(ym,day,name){const x=scheduleStore()[ym]?.[day]?.[name];return x&&typeof x==='object'?{confirmed:x.confirmed===true,items:Array.isArray(x.items)?x.items:[]}:{confirmed:false,items:[]}}
function schedule(y,m){const now=new Date();y=Number.isInteger(y)?y:now.getFullYear();m=Number.isInteger(m)?m:now.getMonth();if(m<0){y--;m=11}if(m>11){y++;m=0}const ym=monthKey(y,m),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),store=scheduleStore(),monthlyMemo=monthlyMemoStore()[ym]||'';const heads=['일','월','화','수','목','금','토'].map(x=>'<div class="cal-head">'+x+'</div>').join('');const blanks=Array.from({length:first},()=>'<div class="cal-day empty"></div>').join('');const cells=Array.from({length:days},(_,i)=>{const d=dayKey(i+1),members=family.members.filter(mem=>{const x=memberDayData(ym,d,mem.name);return x.items.length||x.confirmed}),hasFamily=familyDayItems(ym,d).length>0,icons=(hasFamily?'👨‍👩‍👧‍👧 ':'')+members.map(mem=>mem.emoji).join(' ');return '<button class="cal-day" onclick="daySchedule('+y+','+m+','+(i+1)+')"><div class="num">'+(i+1)+'</div><div class="cal-icons">'+(icons||'')+'</div></button>'}).join('');shell('<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">FAMILY CALENDAR</div><div class="row"><button class="ghost" onclick="schedule('+y+','+(m-1)+')">‹ 이전달</button><h1 class="title" style="font-size:24px;margin:0">'+y+'년 '+(m+1)+'월</h1><button class="ghost" onclick="schedule('+y+','+(m+1)+')">다음달 ›</button></div><p class="sub" style="margin-top:12px">우리 가족의 실제 일정을 기록해요. 날짜의 아이콘은 그날 일정 입력을 마친 가족을 뜻합니다.</p><div class="card"><div class="calendar">'+heads+blanks+cells+'</div></div><div class="card"><b>이번 달 가족 메모</b><p class="label" style="line-height:1.6">여행 준비, 학교 행사, 꼭 기억할 일정처럼 날짜 하나에 묶기 어려운 내용을 적어두세요.</p><textarea id="monthlyMemo" maxlength="500" placeholder="예: 10월 가족여행 준비 / 학교 행사 확인">'+esc(monthlyMemo)+'</textarea><button class="secondary full" style="margin-top:10px" onclick="saveMonthlyMemo('+y+','+m+')">메모 저장</button></div><div class="card"><b>일정 입력 방법</b><p class="label" style="line-height:1.7">날짜 선택 → 가족 구성원 선택 → 시작시간·종료시간·일정명 입력<br>일정이 없는 날도 “입력 완료”를 눌러야 공통 가능시간 계산에 포함됩니다.</p></div></div>')}
function daySchedule(y,m,day){const ym=monthKey(y,m),d=dayKey(day),familyItems=familyDayItems(ym,d),familyRows=familyItems.map((it,i)=>'<div class="schedule-item"><b>'+esc(it.start)+'~'+esc(it.end)+'</b><span>'+esc(it.title)+'</span><button class="ghost" onclick="deleteFamilySchedule('+y+','+m+','+day+','+i+')">삭제</button></div>').join(''),rows=family.members.map(mem=>{const x=memberDayData(ym,d,mem.name);return '<button class="day-member" onclick="memberSchedule('+y+','+m+','+day+',\''+encodeURIComponent(mem.name)+'\')"><span><span class="avatar" style="display:inline-grid;margin-right:8px">'+mem.emoji+'</span><b>'+esc(mem.name)+'</b></span><span class="label">'+(x.items.length?x.items.length+'개 일정':(x.confirmed?'일정 없음 · 완료':'입력 필요'))+' ›</span></button>'}).join('');shell('<div class="page"><button class="ghost back" onclick="schedule('+y+','+m+')">← 월간 달력</button><div class="eyebrow">DAILY SCHEDULE</div><h1 class="title">'+(m+1)+'월 '+day+'일</h1><p class="sub">개인 일정과 가족 모두에게 적용되는 일정을 함께 관리해요.</p><div class="card"><b>👨‍👩‍👧‍👧 가족 전체 일정</b><div style="margin-top:12px">'+(familyRows||'<p class="label">등록된 가족 일정이 없어요.</p>')+'</div><div class="field"><label>시작시간</label><select id="familyStart">'+timeOptions('09:00')+'</select></div><div class="field"><label>종료시간</label><select id="familyEnd">'+timeOptions('18:00')+'</select></div><div class="field"><label>일정명</label><input id="familyTitle" maxlength="40" placeholder="예: 가족여행, 병원, 가족모임"></div><button class="primary full" onclick="addFamilySchedule('+y+','+m+','+day+')">+ 가족 전체 일정 추가</button></div><div class="card"><b>개인 일정</b>'+rows+'</div></div>')}
function memberSchedule(y,m,day,key){const name=decodeURIComponent(key),ym=monthKey(y,m),d=dayKey(day),x=memberDayData(ym,d,name),mem=family.members.find(v=>v.name===name)||{emoji:'👤'};const items=x.items.map((it,i)=>'<div class="schedule-item"><b>'+esc(it.start)+'~'+esc(it.end)+'</b><span>'+esc(it.title)+'</span><button class="ghost" onclick="deleteDailySchedule('+y+','+m+','+day+',\''+key+'\','+i+')">삭제</button></div>').join('');shell('<div class="page"><button class="ghost back" onclick="daySchedule('+y+','+m+','+day+')">← '+(m+1)+'월 '+day+'일</button><div class="eyebrow">MY DAY</div><h1 class="title">'+mem.emoji+' '+esc(name)+'</h1><p class="sub">'+(m+1)+'월 '+day+'일의 실제 일정을 간단히 입력해요.</p><div class="card">'+(items||'<p class="label">등록된 일정이 없어요.</p>')+'</div><div class="card"><div class="field"><label>시작시간</label><select id="dailyStart">'+timeOptions('09:00')+'</select></div><div class="field"><label>종료시간</label><select id="dailyEnd">'+timeOptions('18:00')+'</select></div><div class="field"><label>일정명</label><input id="dailyTitle" maxlength="30" placeholder="예: 회사, 학교, 학원, 운동"></div><button class="primary full" onclick="addDailySchedule('+y+','+m+','+day+',\''+key+'\')">+ 일정 추가</button></div><button class="'+(x.confirmed?'secondary':'primary')+' full" onclick="confirmDaySchedule('+y+','+m+','+day+',\''+key+'\')">'+(x.confirmed?'✓ 입력 완료 · 다시 눌러 취소':'오늘 일정 입력 완료')+'</button></div>')}
function writeMemberDay(ym,d,name,data){const all=scheduleStore();all[ym]=all[ym]||{};all[ym][d]=all[ym][d]||{};all[ym][d][name]=data;localStorage.setItem('gyeongjin_daily_schedules',JSON.stringify(all));pushFamilyStateKey('daily_schedules')}
function addDailySchedule(y,m,day,key){const name=decodeURIComponent(key),start=$('#dailyStart')?.value,end=$('#dailyEnd')?.value,title=$('#dailyTitle')?.value.trim();if(!title){toast('일정명을 입력해주세요');return}if(start>=end){toast('종료 시간은 시작 시간보다 늦어야 해요');return}const ym=monthKey(y,m),d=dayKey(day),x=memberDayData(ym,d,name);if(x.items.some(it=>start<it.end&&end>it.start)){toast('이미 등록된 일정과 시간이 겹쳐요');return}x.items.push({start,end,title});x.items.sort((a,b)=>a.start.localeCompare(b.start));const wasConfirmed=x.confirmed;x.confirmed=false;writeMemberDay(ym,d,name,x);toast(wasConfirmed?'일정을 저장했어요 · 입력 완료를 다시 확인해주세요':'일정을 저장했어요');memberSchedule(y,m,day,key)}
function deleteDailySchedule(y,m,day,key,index){const name=decodeURIComponent(key),ym=monthKey(y,m),d=dayKey(day),x=memberDayData(ym,d,name);x.items.splice(index,1);const wasConfirmed=x.confirmed;x.confirmed=false;writeMemberDay(ym,d,name,x);toast(wasConfirmed?'일정을 삭제했어요 · 입력 완료를 다시 확인해주세요':'일정을 삭제했어요');memberSchedule(y,m,day,key)}
function confirmDaySchedule(y,m,day,key){const name=decodeURIComponent(key),ym=monthKey(y,m),d=dayKey(day),x=memberDayData(ym,d,name);x.confirmed=!x.confirmed;writeMemberDay(ym,d,name,x);toast(x.confirmed?'오늘 일정 입력을 완료했어요':'입력 완료를 취소했어요');memberSchedule(y,m,day,key)}
function dateParts(date){return {y:date.getFullYear(),m:date.getMonth(),ym:monthKey(date.getFullYear(),date.getMonth()),day:dayKey(date.getDate())}}
function freeRangesForMember(ym,day,name){const x=memberDayData(ym,day,name);if(!x.confirmed)return [];const familyBusy=familyDayItems(ym,day),busy=[...x.items,...familyBusy].map(it=>({start:Number(it.start.slice(0,2)),end:Number(it.end.slice(0,2))})).sort((a,b)=>a.start-b.start);let cursor=8;const free=[];busy.forEach(it=>{const s=Math.max(8,it.start),e=Math.min(22,it.end);if(s>cursor)free.push({start:cursor,end:s});cursor=Math.max(cursor,e)});if(cursor<22)free.push({start:cursor,end:22});return free.filter(r=>r.end>r.start)}
function getCommonTimeRangesForDate(date){const p=dateParts(date);if(!family.members.length||!family.members.every(mem=>memberDayData(p.ym,p.day,mem.name).confirmed))return [];let common=[{start:8,end:22}];family.members.forEach(mem=>{const free=freeRangesForMember(p.ym,p.day,mem.name),next=[];common.forEach(a=>free.forEach(b=>{const start=Math.max(a.start,b.start),end=Math.min(a.end,b.end);if(end>start)next.push({start,end})}));common=next});return common.map(r=>({start:String(r.start).padStart(2,'0')+':00',end:String(r.end).padStart(2,'0')+':00'}))}
function getCommonSlots(period){const b=periodBounds(period||'이번 주'),slots=[];for(let d=new Date(b.from);d<=b.to;d.setDate(d.getDate()+1)){const date=new Date(d),p=dateParts(date);getCommonTimeRangesForDate(date).forEach(range=>slots.push({date:date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+p.day,label:(date.getMonth()+1)+'월 '+date.getDate()+'일',day:p.day,...range}))}return slots.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start))}
function seedFamilyAppTestData(){if(!confirm('초기모델 테스트 데이터를 넣을까요? 현재 일정·가족시간·추억 데이터는 테스트 데이터로 교체됩니다.'))return;const now=new Date(),y=now.getFullYear(),m=now.getMonth(),ym=monthKey(y,m),maxDay=new Date(y,m+1,0).getDate(),days=[Math.min(3,maxDay),Math.min(10,maxDay),Math.min(17,maxDay)];const all={};all[ym]={};days.forEach((day,i)=>{const d=dayKey(day);all[ym][d]={};family.members.forEach((mem,idx)=>{const starts=['09:00','10:00','11:00','12:00','13:00'];const ends=['12:00','13:00','14:00','15:00','16:00'];all[ym][d][mem.name]={confirmed:true,items:[{start:starts[idx%starts.length],end:ends[idx%ends.length],title:i===0&&idx===0?'회사':'개인 일정'}]}})});['gyeongjin_schedules','gyeongjin_event','gyeongjin_memories','gyeongjin_current_member'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('gyeongjin_daily_schedules',JSON.stringify(all));state.event=null;state.memories=[];state.selected=[];state.draft=null;toast('실제 하루일정 방식의 테스트 데이터가 준비됐어요');setTimeout(()=>schedule(y,m),700)}
function resetFamilyAppData(){if(!confirm('가족 앱의 테스트 데이터를 초기화할까요?'))return;['gyeongjin_schedules','gyeongjin_daily_schedules','gyeongjin_monthly_memos','gyeongjin_member_albums','gyeongjin_event','gyeongjin_memories','gyeongjin_current_member'].forEach(k=>localStorage.removeItem(k));state.event=null;state.memories=[];state.selected=[];state.draft=null;toast('테스트 데이터가 초기화됐어요');setTimeout(home,500)}
function allowanceStore(){return readJSON('gyeongjin_allowance_ledger',{})}
function allowanceAccessibleChildren(){const children=family.members.filter(m=>m.role!=='부모'),current=localStorage.getItem('gyeongjin_current_member')||'';return currentAccount?.isAdmin===true?children:children.filter(m=>m.name===current)}

function allowanceChild(encoded,wallet='free'){const name=decodeURIComponent(encoded),children=allowanceAccessibleChildren();if(!children.some(m=>m.name===name)){toast('이 용돈기입장을 볼 권한이 없어요');return}wallet=['card','minus'].includes(wallet)?wallet:'free';localStorage.setItem('gyeongjin_allowance_child',name);localStorage.setItem('gyeongjin_allowance_wallet',wallet);const allRows=allowanceBook(name,wallet),rows=allRows.filter(x=>(x.status||'approved')==='approved'),pending=allRows.filter(x=>x.status==='pending'),income=rows.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),expense=rows.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0),balance=income-expense,now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),walletLabel=wallet==='card'?'카드용돈':wallet==='minus'?'마이너스':'자유용돈',isMinus=wallet==='minus',debt=Math.max(0,expense-income),admin=currentAccount?.isAdmin===true;const childPicker=admin&&children.length>1?'<div class="choice">'+children.map(m=>'<button class="'+(m.name===name?'sel':'')+'" onclick="allowanceChild(\''+encodeURIComponent(m.name)+'\',\''+wallet+'\')">'+esc(m.name)+'</button>').join('')+'</div>':'';const approvals=admin&&pending.length?'<div class="card"><b>승인 대기 '+pending.length+'건</b>'+pending.map(x=>'<div class="event"><b>'+(x.type==='income'?'수입 ':'지출 ')+Number(x.amount||0).toLocaleString()+'원 · '+esc(x.title)+'</b><br><small>'+esc(x.date)+'</small><div class="row" style="margin-top:8px;gap:8px"><button class="secondary" style="flex:1" onclick="reviewAllowance(\''+encodeURIComponent(name)+'\',\''+x.id+'\',\'approve\',\''+wallet+'\')">승인</button><button class="ghost" style="flex:1" onclick="reviewAllowance(\''+encodeURIComponent(name)+'\',\''+x.id+'\',\'reject\',\''+wallet+'\')">거절</button></div></div>').join('')+'</div>':'';const entry=admin?'<div class="card"><b>빠른 관리</b><div class="grid"><div class="field"><label>구분</label><select id="allowanceType"><option value="expense">지출</option><option value="income">수입</option></select></div><div class="field"><label>금액</label><input id="allowanceAmount" type="number" min="1" inputmode="numeric" placeholder="금액"></div></div><div class="field"><label>내용</label><input id="allowanceTitle" maxlength="40" placeholder="내용"></div><input id="allowanceDate" type="hidden" value="'+today+'"><button class="primary full" onclick="saveAllowance(\''+encodeURIComponent(name)+'\',\''+wallet+'\')">바로 반영</button></div>':'<div class="card"><b>승인 요청</b><div class="field"><label>날짜</label><input id="allowanceDate" type="date" value="'+today+'"></div><div class="field"><label>구분</label><select id="allowanceType"><option value="expense">지출</option><option value="income">수입</option></select></div><div class="field"><label>금액</label><input id="allowanceAmount" type="number" min="1" inputmode="numeric" placeholder="금액"></div><div class="field"><label>내용</label><input id="allowanceTitle" maxlength="40" placeholder="내용"></div><button class="primary full" onclick="saveAllowance(\''+encodeURIComponent(name)+'\',\''+wallet+'\')">승인 요청</button></div>';shell('<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">ALLOWANCE BOOK</div><h1 class="title">💰 '+esc(name)+' 용돈기입장</h1>'+childPicker+allowanceWalletTabs(name,wallet)+'<div class="grid"><div class="stat"><b>'+(isMinus?(-debt):balance).toLocaleString()+'원</b><span class="label">잔고</span></div><div class="stat"><b>'+income.toLocaleString()+'원</b><span class="label">수입</span></div></div>'+entry+'<h2 class="section-title">'+walletLabel+' 거래내역 · 지출 '+expense.toLocaleString()+'원</h2>'+(rows.length?rows.map(x=>'<div class="event"><div class="row"><b>'+(x.type==='income'?'＋ ':'－ ')+Number(x.amount||0).toLocaleString()+'원 · '+esc(x.title)+'</b>'+(admin?'<button class="ghost" onclick="editAllowance(\''+encodeURIComponent(name)+'\',\''+x.id+'\',\''+wallet+'\')">수정</button><button class="ghost" onclick="deleteAllowance(\''+encodeURIComponent(name)+'\',\''+x.id+'\',\''+wallet+'\')">삭제</button>':'')+'</div><small>'+esc(x.date)+'</small></div>').join(''):'<div class="event"><b>'+walletLabel+' 기록이 아직 없어요</b></div>')+'</div>')}
async function saveAllowance(encoded,wallet){const name=decodeURIComponent(encoded),children=allowanceAccessibleChildren();if(!children.some(m=>m.name===name)){toast('저장 권한이 없어요');return}wallet=['card','minus'].includes(wallet)?wallet:'free';const date=$('#allowanceDate')?.value||'',type=$('#allowanceType')?.value||'',amount=Number($('#allowanceAmount')?.value||0),title=$('#allowanceTitle')?.value.trim()||'';if(!date||!['income','expense'].includes(type)||!Number.isFinite(amount)||amount<=0||!title){toast('날짜·구분·금액·내용을 확인해주세요');return}const all=allowanceStore(),rows=Array.isArray(all[name])?all[name]:[];all[name]=[...rows,{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date,type,wallet,amount:Math.round(amount),title,status:currentAccount?.isAdmin===true?'approved':'pending',requestedBy:currentAccount?.name||name,createdAt:new Date().toISOString()}];localStorage.setItem('gyeongjin_allowance_ledger',JSON.stringify(all));const ok=await pushFamilyStateKey('allowance_ledger');toast(ok?(currentAccount?.isAdmin===true?'용돈 내역에 반영했어요':'승인 요청을 저장했어요'):'기기에 저장했지만 가족 동기화는 아직 되지 않았어요');allowanceChild(encoded,wallet)}

async function reviewAllowance(encoded,id,action,wallet){if(currentAccount?.isAdmin!==true){toast('부모 관리자만 승인할 수 있어요');return}const name=decodeURIComponent(encoded),all=allowanceStore(),rows=Array.isArray(all[name])?all[name]:[],idx=rows.findIndex(x=>x.id===id&&x.status==='pending');if(idx<0){toast('승인 대기 내역을 찾지 못했어요');return}const before={...rows[idx]};if(action==='approve')rows[idx]={...rows[idx],status:'approved',approvedBy:currentAccount?.name||'',approvedAt:new Date().toISOString()};else rows.splice(idx,1);const after=action==='approve'?{...rows[idx]}:null;all[name]=rows;localStorage.setItem('gyeongjin_allowance_ledger',JSON.stringify(all));await pushFamilyStateKey('allowance_ledger');await addAllowanceAudit(action==='approve'?'승인':'거절',name,before,after);toast(action==='approve'?'승인하여 잔고에 반영했어요':'요청을 거절했어요');allowanceChild(encoded,wallet)}

function home(){state.page='home';updateFamilyCount();nav('home');const ev=state.event;const activeCount=ev&&!ev.finalized?1:0;const memoryCount=state.memories.length;const latest=state.memories[0];const eventHtml=ev?`<div class="event" onclick="${ev.finalized?'detail()':'vote()'}"><div class="row"><b>${esc(ev.title)}</b><span class="tag">${ev.finalized?'확정':'투표 중'}</span></div><small>${esc(ev.date)} · ${esc(ev.time)} · 후보 ${ev.candidates?.length||0}개</small></div>`:`<div class="event" onclick="create()"><div class="row"><b>아직 정한 가족시간이 없어요</b><span class="tag">시작하기</span></div><small>우리 가족이 함께할 시간을 만들어보세요.</small></div>`;shell(`<div class="page"><section class="card hero"><div class="eyebrow">우리 가족의 다음 시간</div><h1 class="title">이번 주, 같이<br>무엇을 해볼까요?</h1><p class="sub">공통 가능 시간은 참고하고,<br>가족이 직접 정한 시간을 추억으로 남겨요.</p><button class="primary full" onclick="create()">가족시간 만들기</button><button class="ghost full" onclick="schedule()">📅 가족 일정 보기</button><button class="ghost full" onclick="allowance()">💰 용돈기입장</button></section><div class="grid"><div class="stat"><b>${activeCount}</b><span class="label">진행 중인 가족시간</span></div><div class="stat"><b>${memoryCount}</b><span class="label">우리 가족의 추억</span></div></div><h2 class="section-title">가족시간</h2>${eventHtml}<h2 class="section-title">최근 추억</h2>${latest?`<div class="memory" onclick="memories()"><div class="fakephoto">${latest.photoData?`<img src="${latest.photoData}" alt="최근 가족 추억" style="width:100%;height:100%;object-fit:cover">`:"📷"}</div><div class="body"><b>${esc(latest.title)}</b><br><small>${esc(latest.date)} · ${esc(latest.mood)}</small></div></div>`:`<div class="event" onclick="memories()"><div class="row"><b>아직 저장된 추억이 없어요</b><span class="tag">추억 남기기</span></div><small>가족시간을 보낸 뒤 사진과 한마디를 남겨보세요.</small></div>`}</div>`)}
function periodBounds(period){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dow=start.getDay(),monday=new Date(start);monday.setDate(start.getDate()-((dow+6)%7));const from=new Date(monday),to=new Date(monday);if(period==='다음 주'){from.setDate(from.getDate()+7);to.setDate(to.getDate()+13)}else{to.setDate(to.getDate()+6)}return {from,to}}
function currentMonthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function hasScheduleInPeriod(period){const b=periodBounds(period||'이번 주');for(let d=new Date(b.from);d<=b.to;d.setDate(d.getDate()+1)){const p=dateParts(d);if(family.members.some(mem=>memberDayData(p.ym,p.day,mem.name).confirmed))return true}return false}
function completionStatusInPeriod(period){const b=periodBounds(period||'이번 주');let confirmed=0,total=0,completeDays=0;for(let d=new Date(b.from);d<=b.to;d.setDate(d.getDate()+1)){const p=dateParts(d),count=family.members.filter(mem=>memberDayData(p.ym,p.day,mem.name).confirmed).length;confirmed+=count;total+=family.members.length;if(family.members.length&&count===family.members.length)completeDays++}return {confirmed,total,completeDays}}
function periodLabel(period){const b=periodBounds(period),fmt=d=>(d.getMonth()+1)+'/'+d.getDate();return period+' ('+fmt(b.from)+'~'+fmt(b.to)+')'}
function slotDate(day){const now=new Date();return new Date(now.getFullYear(),now.getMonth(),Number(day))}
function slotInPeriod(slot,period){const d=slotDate(slot.day),b=periodBounds(period);return d>=b.from&&d<=b.to}
function create(){nav('create');state.draft=state.draft||{period:'이번 주',day:'평일'};const scheduleReady=hasScheduleInPeriod(state.draft.period),status=completionStatusInPeriod(state.draft.period);shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">STEP 1 / 3</div><h1 class="title">가족시간 만들기</h1><p class="sub">가족 일정의 공통 가능 시간을 참고한 뒤, 주최자가 날짜와 시간을 직접 정해요.</p>${scheduleReady?'':'<div class="card"><b>가족 일정이 아직 없어요</b><p class="label" style="line-height:1.6">가족 구성원 모두가 실제 하루 일정을 입력 완료하면 비어 있는 시간을 계산해 함께할 수 있는 시간만 보여드려요.</p><button class="secondary full" onclick="schedule()">📅 가족 일정 입력하기</button></div>'}<div class="card"><div class="field"><label>언제쯤?</label><div class="choice" id="dates"><button class="${state.draft.period==='이번 주'?'sel':''}" onclick="pickValue('period','이번 주',this)">${periodLabel('이번 주')}</button><button class="${state.draft.period==='다음 주'?'sel':''}" onclick="pickValue('period','다음 주',this)">${periodLabel('다음 주')}</button></div></div><div class="field"><label>가능한 요일</label><div class="choice"><button class="${state.draft.day==='평일'?'sel':''}" onclick="pickValue('day','평일',this)">평일</button><button class="${state.draft.day==='토'?'sel':''}" onclick="pickValue('day','토',this)">토요일</button><button class="${state.draft.day==='일'?'sel':''}" onclick="pickValue('day','일',this)">일요일</button><button class="${state.draft.day==='전체'?'sel':''}" onclick="pickValue('day','전체',this)">전체</button></div></div><div class="notice">⏰ 선택한 실제 날짜 범위 안에서 가족 일정의 공통 가능 시간만 계산해요.<br>현재 입력 완료 ${status.confirmed}/${status.total} · 가족 전원 완료 날짜 ${status.completeDays}일</div></div><div class="card"><div class="row"><div><b>참여 가족</b><div class="label">부모 ${family.members.filter(m=>m.role==='부모').length}명 + 자녀 ${family.members.filter(m=>m.role!=='부모').length}명</div></div><div class="member">${family.members.slice(0,3).map(m=>`<div class="avatar">${m.emoji}</div>`).join('')}</div></div></div><button class="primary full" onclick="candidates()"> function pickValue(key,value,el){state.draft=state.draft||{};state.draft[key]=value;el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function candidates(){const d=state.draft||{period:'이번 주',day:'평일'};const slots=getCommonSlots(d.period).filter(x=>{const wd=new Date(x.date+'T12:00:00').getDay();if(d.day==='전체')return true;if(d.day==='평일')return wd>=1&&wd<=5;if(d.day==='토')return wd===6;if(d.day==='일')return wd===0;return true});const shown=slots.slice(0,5);state.candidateSlots=shown;shell('<div class="page"><button class="ghost back" onclick="create()">← 이전</button><div class="eyebrow">STEP 2 / 3</div><h1 class="title">공통 가능 시간을 참고하세요</h1><p class="sub">입력된 가족 일정으로 계산한 참고 정보예요. 이 결과와 관계없이 주최자가 날짜와 시간을 직접 정할 수 있습니다.</p><div class="card"><div class="row"><b>공통 가능 시간</b><span class="tag">'+shown.length+'개</span></div><p class="label">'+esc(shown.length?shown.map(x=>x.label+' '+x.start+'~'+x.end).join(', '):'현재 계산된 공통 가능 시간이 없습니다. 주최자가 직접 날짜와 시간을 정할 수 있습니다.')+'</p></div><div class="card">'+(shown.length?shown.map((x,i)=>'<div class="event"><div class="row"><b>후보 '+(i+1)+'</b><span class="tag">'+x.day+'일</span></div><small>'+x.start+' ~ '+x.end+' · 가족 '+family.members.length+'명 모두 가능</small></div>').join(''):'<div class="event"><b>참고 가능한 공통 시간이 아직 없어요</b><br><small>일정 입력이 덜 되었거나 실제로 겹치는 시간이 없을 수 있습니다. 후보 생성은 계속할 수 있습니다.</small><button class="secondary full" style="margin-top:10px" onclick="schedule()">📅 가족 일정 확인하기</button></div>')+'</div><button class="primary full" onclick="candidateForm()">주최자가 날짜·시간 정하기</button></div>')}
function candidateForm(){const slots=Array.isArray(state.candidateSlots)?state.candidateSlots:[],now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),reference=slots.length?slots.map(x=>x.label+' '+x.start+'~'+x.end).join(', '):'계산된 공통 가능 시간이 없습니다. 그래도 주최자가 직접 날짜와 시간을 정할 수 있습니다.',admin=currentAccount?.isAdmin===true,selected=new Set((state.draft?.participants||family.members.map(m=>m.name)));shell('<div class="page"><button class="ghost back" onclick="candidates()">← 이전</button><div class="eyebrow">STEP 3 / 3</div><h1 class="title">무엇을 할까요?</h1><p class="sub">'+(admin?'관리자는 시간과 참여 인원 제한 없이 가족시간을 만들 수 있어요.':'공통 가능 시간은 참고하고 실제 가족시간은 직접 정해요.')+'</p><div class="card"><div class="notice">참고 공통시간: '+esc(reference)+'</div><div class="field"><label>날짜</label><input id="candidateDate" type="date" value="'+today+'"></div><div class="field"><label>시작 시간</label><input id="candidateStart" type="time" value="10:00"></div><div class="field"><label>종료 시간</label><input id="candidateEnd" type="time" value="12:00"></div><div class="field"><label>참여 가족</label><div class="choice" id="participantChoices">'+family.members.map((m,i)=>'<button type="button" class="'+(selected.has(m.name)?'sel':'')+'" data-member="'+encodeURIComponent(m.name)+'" onclick="toggleParticipant(this)">'+m.emoji+' '+esc(m.name)+'</button>').join('')+'</div><p class="label">'+(admin?'관리자는 1명부터 원하는 구성원만 선택할 수 있습니다.':'함께할 가족을 선택해주세요.')+'</p></div><div class="field"><label>후보 1</label><input class="activityCandidate" value="서울숲 산책 + 카페"></div><div class="field"><label>후보 2</label><input class="activityCandidate" value="국립중앙박물관"></div><div class="field"><label>후보 3</label><input class="activityCandidate" value="집에서 영화 + 피자"></div><div class="field"><label>가족에게 전할 한마디</label><textarea placeholder="이번에는 다 같이 편하게 보내자 :) "></textarea></div></div>'+(admin?'<div class="card"><b>관리자 결정 방식</b><p class="label">투표를 열거나, 입력한 내용을 바로 확정 일정으로 지정할 수 있어요.</p><button class="primary full" onclick="startFamilyVote()">가족 투표로 결정</button><button class="secondary full" style="margin-top:8px" onclick="createDirectAdminEvent()">관리자가 지정일정으로 확정</button></div>':'<button class="primary full" onclick="startFamilyVote()">가족 투표 시작하기</button>')+'</div>')}
function toggleParticipant(el){el.classList.toggle('sel')}
function createDirectAdminEvent(){if(currentAccount?.isAdmin!==true){toast('관리자만 지정일정을 만들 수 있어요');return}const title=document.querySelector('.activityCandidate')?.value.trim()||'',participants=[...document.querySelectorAll('#participantChoices button.sel')].map(x=>decodeURIComponent(x.dataset.member||'')).filter(Boolean),message=document.querySelector('.card textarea')?.value.trim()||'',date=$('#candidateDate')?.value||'',start=$('#candidateStart')?.value||'',end=$('#candidateEnd')?.value||'';if(!title){toast('지정할 일정명을 입력해주세요');return}if(title.length>40){toast('일정명은 40자 이내로 입력해주세요');return}if(!participants.length){toast('참여 가족을 1명 이상 선택해주세요');return}if(!date||!start||!end){toast('날짜와 시작·종료 시간을 입력해주세요');return}if(end<=start){toast('종료 시간은 시작 시간보다 늦어야 합니다');return}const dt=new Date(date+'T12:00:00'),label=(dt.getMonth()+1)+'월 '+dt.getDate()+'일',creator=currentAccount?.name||localStorage.getItem('gyeongjin_current_member')||'관리자';state.event={title:'가족시간',candidates:[title],date:label,time:start+' ~ '+end,votes:{},finalized:true,finalCandidate:title,finalizedBy:creator,message,timeRange:start+'~'+end,slot:{date,label,start,end},participants,hostSetTime:true,createdBy:creator,adminOverride:true,decisionMode:'direct'};localStorage.setItem('gyeongjin_event',JSON.stringify(state.event));pushFamilyStateKey('event');state.selected=[];state.draft=null;toast('관리자 지정일정으로 바로 확정했어요');setTimeout(detail,500)}

function startFamilyVote(){const admin=currentAccount?.isAdmin===true,candidates=[...new Set([...document.querySelectorAll('.activityCandidate')].map(x=>x.value.trim()).filter(Boolean))];if(candidates.length<2){toast('가족이 비교할 후보를 2개 이상 입력해주세요');return}if(candidates.some(x=>x.length>40)){toast('활동 후보는 40자 이내로 입력해주세요');return}const participants=[...document.querySelectorAll('#participantChoices button.sel')].map(x=>decodeURIComponent(x.dataset.member||'')).filter(Boolean);if(!participants.length){toast('참여 가족을 1명 이상 선택해주세요');return}const message=document.querySelector('.card textarea')?.value.trim()||'',date=document.querySelector('#candidateDate')?.value||'',start=document.querySelector('#candidateStart')?.value||'',end=document.querySelector('#candidateEnd')?.value||'';if(!date||!start||!end){toast('날짜와 시작·종료 시간을 입력해주세요');return}if(end<=start){toast('종료 시간은 시작 시간보다 늦어야 합니다');return}const d=state.draft||{period:'이번 주',day:'전체'},dt=new Date(date+'T12:00:00'),dateLabel=(dt.getMonth()+1)+'월 '+dt.getDate()+'일',common=getCommonTimeRangesForDate(dt),inside=common.some(x=>start>=x.start&&end<=x.end);if(!admin&&common.length&&!inside)toast('공통 가능 시간과 다르지만 주최자 시간으로 후보를 만들었어요');state.event={title:'가족시간',candidates,date:dateLabel,time:start+' ~ '+end,votes:{},finalized:false,finalCandidate:'',message,period:d.period,day:d.day,timeRange:start+'~'+end,slot:{date,label:dateLabel,start,end},participants,hostSetTime:true,createdBy:currentAccount?.name||localStorage.getItem('gyeongjin_current_member')||'',adminOverride:admin,decisionMode:'vote'};localStorage.setItem('gyeongjin_event',JSON.stringify(state.event));pushFamilyStateKey('event');state.selected=[];state.draft=null;vote()}
function vote(){if(state.event?.finalized){detail();return}const ev=state.event;if(!ev||!Array.isArray(ev.candidates)||!ev.candidates.length){toast('먼저 가족시간을 만들어주세요');setTimeout(create,450);return}const names=ev.candidates||[],eligible=Array.isArray(ev.participants)&&ev.participants.length?family.members.filter(m=>ev.participants.includes(m.name)):family.members,currentMember=localStorage.getItem('gyeongjin_current_member')||eligible[0]?.name||'';state.selected=Array.isArray(ev.votes?.[currentMember])?[...ev.votes[currentMember]]:[];shell(`<div class="page"><div class="eyebrow">가족시간 결정</div><h1 class="title">각자 마음에 드는 걸 골라주세요</h1><p class="sub">가족 구성원을 선택한 뒤 마음에 드는 후보를 골라주세요. 가족별 선택은 따로 저장됩니다.</p><div class="notice">💡 여러 후보를 선택할 수 있어요. 가족이 선호하는 선택을 함께 확인한 뒤 최종 시간을 정합니다.</div><div class="card"><div class="field"><label>지금 투표하는 가족</label><select id="voteMember" onchange="changeVoteMember(this.value)">${eligible.map(m=>`<option ${m.name===currentMember?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div><div class="card">${names.map((n,i)=>{const k=String.fromCharCode(97+i);return `<div class="vote"><div><b>${n}</b><br><small>${ev.date} · ${ev.time}</small></div><button class="check ${state.selected.includes(k)?'on':''}" onclick="toggleVote('${k}',this)">${state.selected.includes(k)?'✓':'○'}</button></div>${i<names.length-1?'<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">':''}`}).join('')}</div><button class="primary full" onclick="voteDone()">내 선택 저장</button></div>`)}

function changeVoteMember(name){localStorage.setItem('gyeongjin_current_member',name);vote()}
function toggleVote(k,b){state.selected=state.selected.includes(k)?state.selected.filter(x=>x!==k):[...state.selected,k];b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':'○'}
function voteDone(){const member=$('#voteMember')?.value||family.members[0]?.name||'';if(!member){toast('투표할 가족 구성원을 선택해주세요');return}if(!state.selected.length){toast('후보를 하나 이상 선택해주세요');return}state.event=state.event||{};state.event.votes=state.event.votes||{};state.event.votes[member]=[...state.selected];localStorage.setItem('gyeongjin_current_member',member);localStorage.setItem('gyeongjin_event',JSON.stringify(state.event));pushFamilyStateKey('event');state.selected=[];toast(member+' 의견이 저장됐어요');setTimeout(()=>result(),700)}
function result(){const ev=state.event||{title:"가족시간",candidates:["서울숲 산책 + 카페","국립중앙박물관","집에서 영화 + 피자"],votes:{}};const names=ev.candidates||[];const counts=names.map((_,i)=>{const k=String.fromCharCode(97+i);return Object.values(ev.votes||{}).filter(v=>Array.isArray(v)&&v.includes(k)).length});const max=Math.max(1,...counts);const voterCount=Object.keys(ev.votes||{}).length;const memberCount=Array.isArray(ev.participants)&&ev.participants.length?ev.participants.length:family.members.length;shell(`<div class="page"><div class="eyebrow">투표 결과</div><h1 class="title">가족 의견을 모았어요</h1><p class="sub">현재 ${voterCount}명 / 가족 ${memberCount}명이 투표했어요. 결과를 보고 함께 이야기한 뒤 부모가 최종 확정합니다.</p><div class="card">${names.map((n,i)=>{const count=counts[i];const width=Math.max(8,Math.round(count/max*100));return `<div style="margin:14px 0"><b>${n}</b><div class="progress" style="margin:9px 0"><i style="width:${width}%"></i></div><small>${count}표</small></div>`}).join("")}</div><button class="secondary full" onclick="vote()">가족 구성원 투표 이어하기</button><button class="primary full" onclick="familyDiscuss()">가족과 이야기하고 최종 확정하기</button></div>`);}
function familyDiscuss(){const ev=state.event;if(!ev||!ev.candidates?.length){toast('먼저 가족시간을 만들어주세요');return}if(ev.finalized){detail();return}const parents=family.members.filter(m=>m.admin||m.role==='부모');if(!parents.length){toast('최종 결정을 담당할 부모가 등록되어 있지 않아요');return}const current=localStorage.getItem('gyeongjin_current_member')||'',currentParent=parents.some(m=>m.name===current)?current:parents[0].name,selectedFinal=typeof ev.finalCandidate==='string'?Math.max(0,ev.candidates.indexOf(ev.finalCandidate)):0,counts=ev.candidates.map((_,i)=>{const k=String.fromCharCode(97+i);return Object.values(ev.votes||{}).filter(v=>Array.isArray(v)&&v.includes(k)).length}),voterCount=Object.keys(ev.votes||{}).length,memberCount=Array.isArray(ev.participants)&&ev.participants.length?ev.participants.length:family.members.length,rawDate=ev.slot?.date||'',rawStart=ev.slot?.start||String(ev.time||'').split(' ~ ')[0]||'',rawEnd=ev.slot?.end||String(ev.time||'').split(' ~ ')[1]||'';shell(`<div class="page"><button class="ghost back" onclick="result()">← 투표 결과</button><div class="eyebrow">부모 최종 결정</div><h1 class="title">이제 같이 이야기해요</h1><p class="sub">투표와 공통 가능 시간은 참고자료예요. 최종 날짜와 시간도 주최자가 직접 조정할 수 있습니다.</p><div class="card"><b>투표 현황</b><p class="label">현재 ${voterCount}명 / 가족 ${memberCount}명이 투표했어요.</p>${ev.candidates.map((n,i)=>`<div class="event"><div class="row"><b>${n}</b><span class="tag">${counts[i]}표</span></div></div>`).join('')}</div><div class="card"><div class="field"><label>최종 결정하는 부모</label><select id="finalParent">${parents.map(m=>`<option ${m.name===currentParent?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>협의한 최종 활동</label><select id="finalChoice">${ev.candidates.map((n,i)=>`<option value="${i}" ${i===selectedFinal?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>최종 날짜</label><input id="finalDate" type="date" value="${esc(rawDate)}"></div><div class="field"><label>시작 시간</label><input id="finalStart" type="time" value="${esc(rawStart)}"></div><div class="field"><label>종료 시간</label><input id="finalEnd" type="time" value="${esc(rawEnd)}"></div></div><div class="notice">공통 가능 시간과 달라도 저장할 수 있습니다. 최종 결정은 가족 협의와 주최자 판단을 따릅니다.</div><button class="primary full" onclick="finalizeDiscussedEvent()">협의한 가족시간 최종 확정</button></div>`)}
function finalizeDiscussedEvent(){const ev=state.event;if(!ev?.candidates?.length){toast('먼저 가족시간을 만들어주세요');return}const parentName=$('#finalParent')?.value||'',parent=family.members.find(m=>m.name===parentName&&(m.admin===true||m.role==='부모'));if(!parent){toast('부모 구성원만 최종 확정할 수 있어요');return}const idx=Number($('#finalChoice')?.value),date=$('#finalDate')?.value||'',start=$('#finalStart')?.value||'',end=$('#finalEnd')?.value||'';if(!Number.isInteger(idx)||!ev.candidates[idx]){toast('최종 활동을 선택해주세요');return}if(!date||!start||!end){toast('최종 날짜와 시간을 입력해주세요');return}if(end<=start){toast('종료 시간은 시작 시간보다 늦어야 합니다');return}const dt=new Date(date+'T12:00:00'),label=(dt.getMonth()+1)+'월 '+dt.getDate()+'일';ev.finalized=true;ev.finalCandidate=ev.candidates[idx];ev.finalizedBy=parent.name;ev.date=label;ev.time=start+' ~ '+end;ev.timeRange=start+'~'+end;ev.slot={date,label,start,end};state.event=ev;localStorage.setItem('gyeongjin_event',JSON.stringify(ev));pushFamilyStateKey('event');toast(parent.name+'님이 가족시간을 확정했어요');setTimeout(detail,500)}

function finalizeEvent(){const ev=state.event;if(!ev||!ev.candidates?.length){toast('먼저 가족시간을 만들어주세요');return}toast('투표 결과만으로는 확정하지 않아요. 가족 협의 후 최종 활동을 선택해주세요');setTimeout(familyDiscuss,450)}
function detail(){const ev=state.event;if(!ev){toast('먼저 가족시간을 만들어주세요');setTimeout(create,450);return}const members=Array.isArray(ev.participants)&&ev.participants.length?family.members.filter(m=>ev.participants.includes(m.name)):family.members,memberCount=members.length;shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">${ev.finalized?'가족시간 확정':'가족시간 상세'}</div><h1 class="title">${ev.finalized?ev.finalCandidate:ev.title}</h1><p class="sub">${ev.date} · ${ev.time}</p><div class="card"><div class="row"><b>참여 가족</b><span class="tag">${memberCount}명</span></div><div style="margin-top:12px" class="member">${members.map(m=>`<div class="avatar">${m.emoji}</div>`).join('')}</div></div><div class="card"><b>가족에게 전한 한마디</b><p class="label">${esc(ev.message||'함께할 활동을 가족과 정해봐요.')}</p></div><div class="card"><b>오늘의 기록</b><p class="label">사진과 각자의 한마디를 남기면 이 시간이 가족의 추억이 됩니다.</p><button class="secondary full" onclick="${ev.finalized?'record()':'familyDiscuss()'}">${ev.finalized?'활동 기록하기':'가족시간 먼저 확정하기'}</button></div></div>`)}
function record(){shell(`<div class="page"><button class="ghost back" onclick="detail()">← 이전</button><div class="eyebrow">추억 기록</div><h1 class="title">오늘 어땠나요?</h1><div class="card"><div class="field"><label>사진</label><input id="memoryPhoto" type="file" accept="image/*" onchange="previewPhoto(this)"><div id="photoPreview" style="height:130px;margin-top:9px;border:1px dashed #d8cabc;border-radius:16px;display:grid;place-items:center;color:var(--muted)">＋ 사진을 선택하면 미리보여요</div></div><div class="field"><label>나의 한마디</label><textarea id="memoryText" placeholder="오늘 제일 좋았던 순간은..."></textarea></div><div class="field"><label>오늘의 기분</label><div class="choice"><button onclick="pick(this)">😍 최고</button><button class="sel" onclick="pick(this)">😊 좋음</button><button onclick="pick(this)">😐 보통</button><button onclick="pick(this)">🥱 피곤</button></div></div></div><button class="primary full" onclick="saveMemory()">추억에 저장하기</button></div>`)}
function previewPhoto(input){const box=$('#photoPreview');const file=input&&input.files&&input.files[0];if(!box||!file)return;const url=URL.createObjectURL(file);box.innerHTML='<img src="'+url+'" alt="추억 사진 미리보기" style="width:100%;height:100%;object-fit:cover;border-radius:15px">';box.dataset.photoName=file.name}
function compressPhoto(file,maxSize=1200,quality=.78){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const max=maxSize;const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',quality))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image load failed'))};img.src=url})}
function formatMemoryDate(){const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
async function saveMemory(){const ev=state.event;if(!ev){toast('먼저 가족시간을 만들어주세요');return}if(!ev.finalized){toast('가족시간을 최종 확정한 뒤 추억을 기록해주세요');return}const text=$('#memoryText')?.value.trim()||'오늘 함께 걷고 웃었던 시간을 남겼어요.';const mood=[...document.querySelectorAll('.choice button.sel')].pop()?.textContent.trim()||'😊 좋음';const file=$('#memoryPhoto')?.files?.[0];let photoData='';if(file){try{photoData=await compressPhoto(file)}catch(e){toast('사진을 읽지 못했어요');return}}const memory={title:ev.finalized?ev.finalCandidate:ev.title,date:ev.date||formatMemoryDate(),text,mood,photoName:file?.name||'',photoData};const next=[memory,...state.memories];try{localStorage.setItem('gyeongjin_memories',JSON.stringify(next));state.memories=next;pushFamilyStateKey('memories')}catch(e){toast('사진 저장 공간이 부족해요. 더 작은 사진으로 다시 시도해주세요');return}toast('사진과 가족 추억을 저장했어요');setTimeout(memories,700)}
function memories(){nav('memory');shell(`<div class="page"><div class="eyebrow">우리 가족</div><h1 class="title">추억</h1><p class="sub">함께 보낸 시간이 차곡차곡 쌓여요.</p>${state.memories.map(m=>`<div class="memory"><div class="fakephoto">${m.photoData?`<img src="${m.photoData}" alt="가족 추억 사진" style="width:100%;height:100%;object-fit:cover">`:m.photoName?"🖼️":"📷"}</div><div class="body"><b>${esc(m.title)}</b><br><small>${esc(m.date)} · ${esc(m.mood)}${m.photoName?" · 사진 첨부":""}</small><p style="line-height:1.5">${esc(m.text)}</p></div></div>`).join('')}</div>`)}
const savedFamily=readJSON('gyeongjin_family_members',null);
const family={members:Array.isArray(savedFamily)&&savedFamily.length?savedFamily:[{name:'아빠',role:'부모',admin:true,emoji:'👤'},{name:'엄마',role:'부모',admin:true,emoji:'👤'},{name:'첫째',role:'자녀',admin:false,emoji:'👧'},{name:'둘째',role:'자녀',admin:false,emoji:'👧'},{name:'셋째',role:'자녀',admin:false,emoji:'👧'}]};
let newMemberRole='자녀';
let memberAlbumTimer=null;
function profilePhotoStore(){return readJSON('gyeongjin_profile_photos',{})}
function profilePhoto(name){const v=profilePhotoStore()[name];return typeof v==='string'&&v.startsWith('data:image/')?v:''}
async function setProfilePhoto(key,input){const name=decodeURIComponent(key),file=input?.files?.[0];if(!file)return;const current=localStorage.getItem('gyeongjin_current_member')||'',admin=currentAccount?.isAdmin===true;if(current!==name&&!admin){toast('본인 프로필 사진만 변경할 수 있어요');return}try{const photo=await compressPhoto(file,600,.72),all=profilePhotoStore();all[name]=photo;localStorage.setItem('gyeongjin_profile_photos',JSON.stringify(all));await pushFamilyStateKey('profile_photos');toast('프로필 사진을 변경했어요');memberProfile(key)}catch(e){toast('프로필 사진을 저장하지 못했어요')}}
function removeProfilePhoto(key){const name=decodeURIComponent(key),current=localStorage.getItem('gyeongjin_current_member')||'',admin=currentAccount?.isAdmin===true;if(current!==name&&!admin){toast('본인 프로필 사진만 변경할 수 있어요');return}const all=profilePhotoStore();delete all[name];localStorage.setItem('gyeongjin_profile_photos',JSON.stringify(all));pushFamilyStateKey('profile_photos');toast('프로필 사진을 삭제했어요');memberProfile(key)}
function memberAlbumStore(){return readJSON('gyeongjin_member_albums',{})}
function memberAlbum(name){const all=memberAlbumStore(),items=all[name];return Array.isArray(items)?items.filter(x=>typeof x==='string'&&x.startsWith('data:image/')).slice(0,10):[]}
function stopMemberAlbum(){if(memberAlbumTimer){clearInterval(memberAlbumTimer);memberAlbumTimer=null}}
function memberAlbumHtml(name,editable){const photos=memberAlbum(name),key=encodeURIComponent(name);return '<div class="album" id="memberAlbum">'+(photos.length?'<img id="memberAlbumImage" src="'+photos[0]+'" alt="'+esc(name)+' 사진첩"><span class="album-count" id="memberAlbumCount">1 / '+photos.length+'</span>':'<div class="album-empty">📷<br>아직 등록된 사진이 없어요.</div>')+'</div>'+(editable?'<div class="album-actions"><label class="btn secondary" style="text-align:center">+ 사진 추가<input type="file" accept="image/*" multiple style="display:none" onchange="addMemberAlbumPhotos(\''+key+'\',this)"></label>'+(photos.length?'<button class="ghost" onclick="clearMemberAlbum(\''+key+'\')">전체 삭제</button>':'')+'</div>':'')}
function startMemberAlbum(name){stopMemberAlbum();const photos=memberAlbum(name);if(photos.length<2)return;let i=0;memberAlbumTimer=setInterval(()=>{const img=$('#memberAlbumImage'),count=$('#memberAlbumCount');if(!img){stopMemberAlbum();return}i=(i+1)%photos.length;img.src=photos[i];if(count)count.textContent=(i+1)+' / '+photos.length},5000)}
async function addMemberAlbumPhotos(key,input){const name=decodeURIComponent(key),files=[...(input?.files||[])],current=memberAlbum(name);if(!files.length)return;if(current.length>=10){toast('사진은 최대 10장까지 저장할 수 있어요');return}const room=10-current.length,picked=files.slice(0,room),added=[];for(const file of picked){try{added.push(await compressPhoto(file,900,.7))}catch(e){}}if(!added.length){toast('사진을 읽지 못했어요');return}const all=memberAlbumStore();all[name]=[...current,...added].slice(0,10);try{localStorage.setItem('gyeongjin_member_albums',JSON.stringify(all));pushFamilyStateKey('member_albums')}catch(e){toast('사진 저장 공간이 부족해요');return}toast((files.length>room?'최대 10장까지만 ':'')+added.length+'장 저장했어요');memberProfile(key)}
function clearMemberAlbum(key){const name=decodeURIComponent(key);if(!confirm(name+' 사진첩의 사진을 모두 삭제할까요?'))return;const all=memberAlbumStore();delete all[name];localStorage.setItem('gyeongjin_member_albums',JSON.stringify(all));pushFamilyStateKey('member_albums');toast('사진첩을 비웠어요');memberProfile(key)}
function memberProfile(key){const name=decodeURIComponent(key),m=family.members.find(v=>v.name===name);if(!m){familyScreen();return}const current=localStorage.getItem('gyeongjin_current_member')||'',admin=currentAccount?.isAdmin===true,editable=!current||current===name||admin,photo=profilePhoto(name);shell('<div class="page"><button class="ghost back" onclick="familyScreen()">← 우리 가족</button><div class="eyebrow">FAMILY PROFILE</div><div class="card" style="text-align:center"><div style="width:112px;height:112px;border-radius:50%;overflow:hidden;margin:0 auto 12px;background:#f3eee8;display:grid;place-items:center;font-size:48px">'+(photo?'<img src="'+photo+'" alt="'+esc(name)+' 프로필 사진" style="width:100%;height:100%;object-fit:cover">':m.emoji)+'</div><h1 class="title" style="margin-bottom:6px">'+esc(m.name)+'</h1><p class="sub">'+esc(m.role)+(m.admin?' · 관리자':'')+'</p>'+(editable?'<label class="btn secondary" style="display:block;text-align:center">프로필 사진 변경<input type="file" accept="image/*" style="display:none" onchange="setProfilePhoto(\''+encodeURIComponent(name)+'\',this)"></label>'+(photo?'<button class="ghost full" onclick="removeProfilePhoto(\''+encodeURIComponent(name)+'\')">프로필 사진 삭제</button>':''):'')+'</div><div class="card"><b>개인 사진첩</b><p class="label">최대 10장 · 5초 간격 슬라이드 · 가족은 함께 볼 수 있어요.</p>'+memberAlbumHtml(name,editable)+'</div></div>');startMemberAlbum(name)}

function show(p){if(p==='profile'){familyScreen()}}
function familyScreen(){updateFamilyCount();const loggedIn=!!authToken(),admin=currentAccount?.isAdmin===true;shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">가족 프로필</div><h1 class="title">우리 가족</h1><p class="sub">가족 프로필과 아이콘을 확인하고 관리해요.</p><div class="card">${family.members.map((m,i)=>`<div class="row" style="margin:12px 0"><div class="member"><button class="avatar" style="border:0;padding:0;cursor:pointer" onclick="changeMemberEmoji(${i})" title="아이콘 변경">${m.emoji}</button><button class="ghost" style="padding:4px;text-align:left" onclick="memberProfile('${encodeURIComponent(m.name)}')"><b>${m.name}</b><div class="label">${m.role}${m.admin?' · 관리자':''} · 사진첩 보기</div></button></div>${m.admin?'<span class="tag">관리</span>':'<span class="label">참여</span>'}</div>`).join('')}</div>${!loggedIn?'<div class="notice">계정 등록은 로그인 후 가족 계정 관리에서 진행해주세요.</div>':admin?'<button class="primary full" onclick="familyAccountManager()">가족 계정 관리</button>':''}<div class="card"><b>권한 안내</b><p class="label" style="line-height:1.6;margin-bottom:0">부모: 가족 구성원 등록·관리, 가족시간 최종 결정<br>자녀: 가족시간 참여·투표, 추억 기록</p></div></div>`)}
async function changeMemberEmoji(index){const m=family.members[index];if(!m)return;const next=prompt(m.name+'의 달력 아이콘을 입력해주세요.\n이모지 1개를 권장해요.',m.emoji||'👤');if(next===null)return;const icon=Array.from(next.trim()).slice(0,2).join('');if(!icon){toast('아이콘을 입력해주세요');return}try{if(authToken()){const r=await api('/api/members'),account=(r.members||[]).find(x=>x.name===m.name);if(!account)throw new Error('가족 계정을 찾을 수 없습니다.');await api(account.id===currentAccount?.id?'/api/account':'/api/members/account',{method:'PUT',body:JSON.stringify(account.id===currentAccount?.id?{emoji:icon}:{memberId:account.id,emoji:icon})});await syncFamilyMembers()}else{m.emoji=icon;localStorage.setItem('gyeongjin_family_members',JSON.stringify(family.members))}toast(m.name+' 아이콘을 변경했어요');familyScreen()}catch(e){toast(e.message)}}
function addFamilyMember(){newMemberRole='자녀';shell(`<div class="page"><button class="ghost back" onclick="familyScreen()">← 가족 관리</button><div class="eyebrow">가족 구성원 등록</div><h1 class="title">누구를 추가할까요?</h1><p class="sub">MVP에서는 부모가 직접 가족 구성원을 등록해요.</p><div class="card"><div class="field"><label>이름</label><input id="memberName" placeholder="예: 막내"></div><div class="field"><label>달력 아이콘</label><input id="memberEmoji" maxlength="4" value="🙂" placeholder="예: 👨 👩 👧"></div><div class="field"><label>역할</label><div class="choice"><button class="sel" onclick="pickFamilyRole('자녀',this)">자녀</button><button onclick="pickFamilyRole('부모',this)">부모</button></div></div></div><button class="primary full" onclick="saveFamilyMember()">가족 구성원 저장</button></div>`)}
function pickFamilyRole(role,el){newMemberRole=role;el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function saveFamilyMember(){const n=$('#memberName').value.trim();if(!n){toast('이름을 입력해주세요');return}if(family.members.some(m=>m.name===n)){toast('이미 등록된 가족 이름이에요');return}const isParent=newMemberRole==='부모',rawIcon=$('#memberEmoji')?.value.trim()||'🙂',icon=Array.from(rawIcon).slice(0,2).join('');family.members.push({name:n,role:newMemberRole,admin:isParent,emoji:icon});localStorage.setItem('gyeongjin_family_members',JSON.stringify(family.members));toast(n+' 가족 구성원을 등록했어요');setTimeout(familyScreen,500)}
async function bootApp(){try{normalizeState();if(authToken()){try{const r=await api('/api/me');currentAccount=r.member;localStorage.setItem('gyeongjin_current_member',r.member.name);await pullFamilyState();await syncFamilyMembers()}catch(e){currentAccount=null;sessionStorage.removeItem('gyeongjin_auth_token')}}home();document.getElementById('bootFallback')?.remove()}catch(err){console.error('App boot failed',err);const boot=document.getElementById('bootFallback');if(boot)boot.innerHTML='<b>앱 화면을 불러오지 못했어요.</b><p style="color:#82796f;line-height:1.6">저장된 데이터 또는 이전 캐시와 충돌했을 수 있습니다.</p><button style="border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:800;background:#e88963;color:#fff;width:100%" onclick="location.reload()">다시 불러오기</button>'}}bootApp();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(err=>console.warn('SW update failed',err)));}</script></body></html>
