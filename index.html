<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf4"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="/icon-192.png">
<title>경진훈주시라</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#26231f;--muted:#82796f;--line:#eee5da;--accent:#e88963;--accent2:#6f9c8b;--soft:#f7eee5;--danger:#c76d6d}*{box-sizing:border-box}body{margin:0;background:#f1ece6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:82px}.top{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}.page{padding:8px 20px 20px}.eyebrow{color:var(--accent);font-weight:800;font-size:13px;margin:8px 0}.title{font-size:28px;line-height:1.25;margin:0 0 8px}.sub{color:var(--muted);line-height:1.55;margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 3px 12px rgba(80,50,20,.04)}.hero{background:linear-gradient(135deg,#fff0e6,#fffaf4)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);padding:14px;border-radius:16px}.stat b{display:block;font-size:22px;margin-bottom:3px}.label{font-size:12px;color:var(--muted)}button,.btn{border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--ink)}.ghost{background:transparent;color:var(--muted)}.full{width:100%}.section-title{font-size:17px;font-weight:900;margin:22px 0 10px}.event{padding:15px;border:1px solid var(--line);border-radius:17px;margin:9px 0;background:#fff}.event small{color:var(--muted)}.tag{display:inline-block;background:#f2eee9;border-radius:999px;padding:6px 9px;margin:4px 3px 0 0;font-size:12px}.member{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f0d6c5;font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:70px;background:rgba(255,250,244,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.nav button{background:none;color:var(--muted);border-radius:0}.nav button.active{color:var(--accent)}.nav span{display:block;font-size:11px;margin-top:3px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;font:inherit;color:var(--ink);outline:none}textarea{min-height:90px;resize:vertical}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;font-weight:700}.choice button.sel{border-color:var(--accent);background:#fff0e6;color:#a9532e}.back{margin-bottom:8px}.progress{height:7px;background:#eee5da;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:75%}.vote{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.check{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;background:#fff}.check.on{background:var(--accent);color:#fff}.memory{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0}.memory .fakephoto{height:170px;background:linear-gradient(135deg,#e7d2bd,#c5d5cb);display:grid;place-items:center;font-size:44px}.memory .body{padding:15px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#2c2925;color:#fff;padding:11px 15px;border-radius:12px;display:none;font-size:13px;z-index:20}.hide{display:none!important}
</style></head>
<body><div class="app"><header class="top"><div class="brand">경진훈주시라</div><div style="display:flex;gap:6px"><button id="installBtn" class="pill hide" onclick="installApp()">앱 설치</button><button class="pill" onclick="show('profile')">가족 5명</button></div></header><main id="main"></main><nav class="nav"><button id="nav-home" onclick="home()">⌂<span>홈</span></button><button id="nav-create" onclick="create()">＋<span>가족시간</span></button><button id="nav-memory" onclick="memories()">♡<span>추억</span></button></nav></div><div id="toast" class="toast"></div>
<script>
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;document.querySelector("#installBtn")?.classList.remove("hide");});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;document.querySelector("#installBtn")?.classList.add("hide");toast("경진훈주시라 설치가 완료됐어요");});
async function installApp(){if(!deferredInstallPrompt){toast("아직 설치 조건을 확인하는 중이에요");return;}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.querySelector("#installBtn")?.classList.add("hide");}

const state={page:'home',selected:[],vote:{a:3,b:2,c:1},event:null,memories:[{title:'주말 저녁 한강 산책',date:'2026.09.20',text:'걷다가 편의점 아이스크림을 먹었다. 별것 아닌데 오래 기억에 남을 것 같다.',mood:'😊'}]};
const $=s=>document.querySelector(s);function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1600)}
function nav(k){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#nav-'+k)?.classList.add('active')}
function shell(html){$('#main').innerHTML=html}
function home(){state.page='home';nav('home');shell(`<div class="page"><section class="card hero"><div class="eyebrow">우리 가족의 다음 시간</div><h1 class="title">이번 주, 같이<br>무엇을 해볼까요?</h1><p class="sub">모두 가능한 시간을 먼저 맞추고,<br>가족이 함께 정한 시간을 추억으로 남겨요.</p><button class="primary full" onclick="create()">가족시간 만들기</button></section><div class="grid"><div class="stat"><b>2</b><span class="label">진행 중인 가족시간</span></div><div class="stat"><b>12</b><span class="label">우리 가족의 추억</span></div></div><h2 class="section-title">진행 중</h2><div class="event" onclick="vote()"><div class="row"><b>10월 첫 가족 나들이</b><span class="tag">투표 중</span></div><small>10/3 · 후보 3개 · 4명 참여</small></div><div class="event" onclick="detail()"><div class="row"><b>도서관 + 저녁</b><span class="tag">예정</span></div><small>10/4 토요일 · 오후 2:00</small></div><h2 class="section-title">최근 추억</h2><div class="memory" onclick="memories()"><div class="fakephoto">📷</div><div class="body"><b>주말 저녁 한강 산책</b><br><small>2026.09.20 · 😊</small></div></div></div>`)}
function create(){nav('create');shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">STEP 1 / 3</div><h1 class="title">가족시간 만들기</h1><p class="sub">먼저 모두가 가능한 시간을 찾아볼게요.</p><div class="card"><div class="field"><label>언제쯤?</label><div class="choice" id="dates"><button class="sel" onclick="pick(this)">이번 주</button><button onclick="pick(this)">다음 주</button><button onclick="pick(this)">10월 첫째 주</button></div></div><div class="field"><label>가능한 요일</label><div class="choice"><button class="sel" onclick="pick(this)">토</button><button class="sel" onclick="pick(this)">일</button><button onclick="pick(this)">평일</button></div></div><div class="field"><label>시간대</label><select><option>오후 1시 ~ 6시</option><option>오전 10시 ~ 오후 3시</option><option>오후 5시 ~ 9시</option></select></div></div><div class="card"><div class="row"><div><b>참여 가족</b><div class="label">부모 2명 + 자녀 3명</div></div><div class="member"><div class="avatar">아</div><div class="avatar">엄</div><div class="avatar">👧</div></div></div></div><button class="primary full" onclick="candidates()">가능시간 확인하기</button></div>`)}
function pick(el){el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function candidates(){shell(`<div class="page"><button class="ghost back" onclick="create()">← 이전</button><div class="eyebrow">STEP 2 / 3</div><h1 class="title">모두 가능한 시간이에요</h1><p class="sub">가족이 함께 정할 후보를 골라주세요.</p><div class="card"><div class="event"><b>10/3 토요일 · 오후 2:00</b><br><small>5명 모두 가능</small></div><div class="event"><b>10/4 일요일 · 오후 1:00</b><br><small>5명 모두 가능</small></div><div class="event"><b>10/4 일요일 · 오후 3:00</b><br><small>4명 가능 · 아빠 확인 필요</small></div></div><button class="primary full" onclick="candidateForm()">후보 활동 정하기</button></div>`)}
function candidateForm(){shell(`<div class="page"><button class="ghost back" onclick="candidates()">← 이전</button><div class="eyebrow">STEP 3 / 3</div><h1 class="title">무엇을 할까요?</h1><p class="sub">후보를 2~4개 정도 만들어 가족에게 물어봐요.</p><div class="card"><div class="field"><label>후보 1</label><input value="서울숲 산책 + 카페"></div><div class="field"><label>후보 2</label><input value="국립중앙박물관"></div><div class="field"><label>후보 3</label><input value="집에서 영화 + 피자"></div><div class="field"><label>가족에게 전할 한마디</label><textarea placeholder="이번에는 다 같이 편하게 보내자 :) "></textarea></div></div><button class="primary full" onclick="vote()">가족 투표 시작하기</button></div>`)}
function vote(){shell(`<div class="page"><div class="eyebrow">가족시간 결정</div><h1 class="title">각자 마음에 드는 걸 골라주세요</h1><p class="sub">다른 가족의 선택은 투표가 끝날 때까지 보이지 않아요.</p><div class="card"><div class="vote"><div><b>서울숲 산책 + 카페</b><br><small>10/3 토 · 14:00</small></div><button class="check ${state.selected.includes('a')?'on':''}" onclick="toggleVote('a',this)">${state.selected.includes('a')?'✓':'○'}</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="vote"><div><b>국립중앙박물관</b><br><small>10/4 일 · 13:00</small></div><button class="check ${state.selected.includes('b')?'on':''}" onclick="toggleVote('b',this)">${state.selected.includes('b')?'✓':'○'}</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="vote"><div><b>집에서 영화 + 피자</b><br><small>10/4 일 · 15:00</small></div><button class="check ${state.selected.includes('c')?'on':''}" onclick="toggleVote('c',this)">${state.selected.includes('c')?'✓':'○'}</button></div></div><button class="primary full" onclick="voteDone()">내 선택 저장</button></div>`)}
function toggleVote(k,b){state.selected=state.selected.includes(k)?state.selected.filter(x=>x!==k):[...state.selected,k];b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':'○'}
function voteDone(){toast('내 투표가 저장됐어요');setTimeout(()=>result(),700)}
function result(){shell(`<div class="page"><div class="eyebrow">투표 결과</div><h1 class="title">가족 의견을 모았어요</h1><p class="sub">이제 부모가 최종 시간을 결정할 수 있어요.</p><div class="card"><b>서울숲 산책 + 카페</b><div class="progress" style="margin:9px 0"><i style="width:80%"></i></div><small>4표</small></div><div class="card"><b>국립중앙박물관</b><div class="progress" style="margin:9px 0"><i style="width:60%"></i></div><small>3표</small></div><div class="card"><b>집에서 영화 + 피자</b><div class="progress" style="margin:9px 0"><i style="width:40%"></i></div><small>2표</small></div><button class="primary full" onclick="detail()">부모 최종 결정하기</button></div>`)}
function detail(){shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">가족시간 확정</div><h1 class="title">서울숲 산책 + 카페</h1><p class="sub">10월 3일 토요일 · 오후 2:00</p><div class="card"><div class="row"><b>참여 가족</b><span class="tag">5명</span></div><div style="margin-top:12px" class="member"><div class="avatar">아</div><div class="avatar">엄</div><div class="avatar">1</div><div class="avatar">2</div><div class="avatar">3</div></div></div><div class="card"><b>오늘의 기록</b><p class="label">사진과 각자의 한마디를 남기면 이 시간이 가족의 추억이 됩니다.</p><button class="secondary full" onclick="record()">활동 기록하기</button></div></div>`)}
function record(){shell(`<div class="page"><button class="ghost back" onclick="detail()">← 이전</button><div class="eyebrow">추억 기록</div><h1 class="title">오늘 어땠나요?</h1><div class="card"><div class="field"><label>사진</label><div style="height:130px;border:1px dashed #d8cabc;border-radius:16px;display:grid;place-items:center;color:var(--muted)">＋ 사진 추가</div></div><div class="field"><label>나의 한마디</label><textarea placeholder="오늘 제일 좋았던 순간은..."></textarea></div><div class="field"><label>오늘의 기분</label><div class="choice"><button onclick="pick(this)">😍 최고</button><button class="sel" onclick="pick(this)">😊 좋음</button><button onclick="pick(this)">😐 보통</button><button onclick="pick(this)">🥱 피곤</button></div></div></div><button class="primary full" onclick="saveMemory()">추억에 저장하기</button></div>`)}
function saveMemory(){state.memories.unshift({title:'서울숲 산책 + 카페',date:'2026.10.03',text:'오늘 함께 걷고 웃었던 시간을 남겼어요.',mood:'😊'});toast('가족 추억에 저장했어요');setTimeout(memories,700)}
function memories(){nav('memory');shell(`<div class="page"><div class="eyebrow">우리 가족</div><h1 class="title">추억</h1><p class="sub">함께 보낸 시간이 차곡차곡 쌓여요.</p>${state.memories.map(m=>`<div class="memory"><div class="fakephoto">📷</div><div class="body"><b>${m.title}</b><br><small>${m.date} · ${m.mood}</small><p style="line-height:1.5">${m.text}</p></div></div>`).join('')}</div>`)}
function show(p){if(p==='profile'){shell(`<div class="page"><button class="ghost back" onclick="home()">← 홈</button><div class="eyebrow">가족 관리</div><h1 class="title">우리 가족</h1><div class="card">${['아빠 · ADMIN','엄마 · ADMIN','첫째 · MEMBER','둘째 · MEMBER','셋째 · MEMBER'].map((x,i)=>`<div class="row" style="margin:12px 0"><div class="member"><div class="avatar">${i<2?'👤':'👧'}</div><b>${x}</b></div><span class="label">✓</span></div>`).join('')}</div><button class="secondary full" onclick="toast('MVP에서는 부모가 가족 구성원을 관리합니다')">가족 구성원 관리</button></div>`)}
home();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js", {scope:"/"}).then(reg => console.log("PWA service worker ready", reg.scope)).catch(err => console.error("PWA service worker failed", err))); }</script></body></html>
